<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz: Fracciones equivalentes</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
<style>
  body{font-family:ui-rounded,system-ui,-apple-system,'Segoe UI',sans-serif}
  .option-btn{transition:transform .1s ease, background-color .15s ease, border-color .15s ease}
  .option-btn:active{transform:scale(.97)}
  .option-btn:focus-visible{outline:3px solid #4f46e5;outline-offset:2px}
</style>
</head>
<body class="min-h-screen bg-gradient-to-br from-indigo-100 via-white to-violet-100 flex items-center justify-center p-3">
  <main class="w-full max-w-lg bg-white rounded-2xl shadow-2xl border border-indigo-100 p-5">
    <div class="flex items-center justify-between mb-3 gap-2">
      <h1 class="text-xl font-extrabold text-indigo-900">🎯 Fracciones equivalentes</h1>
      <span id="progress" class="text-sm font-bold text-indigo-600 bg-indigo-100 rounded-full px-3 py-1 whitespace-nowrap">Pregunta 1 de 3</span>
    </div>

    <section id="quiz-area" aria-label="Pregunta del quiz">
      <p id="question-text" class="text-lg font-bold text-slate-800 mb-4 leading-snug"></p>
      <div id="options" class="grid grid-cols-2 gap-3" role="group" aria-label="Opciones de respuesta"></div>
      <div id="feedback" class="hidden mt-4 rounded-xl p-3 text-base font-semibold" role="status" aria-live="polite"></div>
      <button id="next-btn" class="hidden mt-4 w-full py-3 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-lg font-extrabold focus:outline-none focus:ring-4 focus:ring-indigo-300">Siguiente →</button>
    </section>

    <section id="final-screen" class="hidden text-center py-1" aria-label="Resultado final">
      <p id="final-emoji" class="text-5xl mb-2"></p>
      <h2 class="text-2xl font-extrabold text-slate-800 mb-1">Puntaje final</h2>
      <p id="final-score" class="text-4xl font-black text-indigo-600 mb-2"></p>
      <p id="final-message" class="text-base font-semibold text-slate-600 mb-4"></p>
      <button id="restart-btn" class="w-full py-3 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-lg font-extrabold focus:outline-none focus:ring-4 focus:ring-indigo-300">🔁 Jugar de nuevo</button>
    </section>
  </main>

<script>
  const questions = [
    {
      text: "¿Cuál de estas fracciones es equivalente a 1/2?",
      options: ["2/4", "2/3", "1/3", "3/5"],
      correct: 0,
      explanation: "2/4 es equivalente a 1/2 porque 1 × 2 = 2 y 2 × 2 = 4."
    },
    {
      text: "¿Qué fracción es equivalente a 3/4?",
      options: ["6/8", "3/8", "4/3", "6/12"],
      correct: 0,
      explanation: "6/8 es equivalente a 3/4 porque 3 × 2 = 6 y 4 × 2 = 8."
    },
    {
      text: "¿Cuál de estas fracciones NO es equivalente a 2/3?",
      options: ["4/6", "6/9", "8/12", "3/4"],
      correct: 3,
      explanation: "3/4 no es equivalente a 2/3. Las demás se obtienen multiplicando 2/3 por 2, 3 y 4."
    }
  ];

  let current = 0;
  let score = 0;
  let answered = false;

  const questionText = document.getElementById('question-text');
  const optionsEl = document.getElementById('options');
  const feedbackEl = document.getElementById('feedback');
  const nextBtn = document.getElementById('next-btn');
  const progressEl = document.getElementById('progress');
  const quizArea = document.getElementById('quiz-area');
  const finalScreen = document.getElementById('final-screen');
  const finalEmoji = document.getElementById('final-emoji');
  const finalScore = document.getElementById('final-score');
  const finalMessage = document.getElementById('final-message');
  const restartBtn = document.getElementById('restart-btn');

  function renderQuestion() {
    answered = false;
    const q = questions[current];
    questionText.textContent = q.text;
    progressEl.textContent = `Pregunta ${current + 1} de ${questions.length}`;
    feedbackEl.className = 'hidden mt-4 rounded-xl p-3 text-base font-semibold';
    feedbackEl.textContent = '';
    nextBtn.classList.add('hidden');
    optionsEl.innerHTML = '';

    q.options.forEach((option, i) => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'option-btn py-3 px-2 rounded-xl border-2 border-slate-200 bg-slate-50 text-slate-800 text-xl font-bold hover:bg-indigo-50 hover:border-indigo-300';
      btn.textContent = option;
      btn.setAttribute('aria-label', option);
      btn.addEventListener('click', () => selectOption(i));
      optionsEl.appendChild(btn);
    });

    nextBtn.focus();
  }

  function selectOption(i) {
    if (answered) return;
    answered = true;

    const q = questions[current];
    const buttons = optionsEl.querySelectorAll('button');
    buttons.forEach((btn, idx) => {
      btn.disabled = true;
      btn.classList.remove('hover:bg-indigo-50', 'hover:border-indigo-300');
      if (idx === q.correct) {
        btn.className = 'option-btn py-3 px-2 rounded-xl border-2 border-green-500 bg-green-100 text-green-900 text-xl font-bold';
      } else if (idx === i) {
        btn.className = 'option-btn py-3 px-2 rounded-xl border-2 border-red-500 bg-red-100 text-red-900 text-xl font-bold';
      } else {
        btn.classList.add('opacity-50');
      }
    });

    const isCorrect = i === q.correct;
    if (isCorrect) {
      score++;
      feedbackEl.className = 'mt-4 rounded-xl p-3 text-base font-semibold bg-green-100 text-green-900';
      feedbackEl.textContent = '✅ ¡Correcto! ' + q.explanation;
    } else {
      feedbackEl.className = 'mt-4 rounded-xl p-3 text-base font-semibold bg-red-100 text-red-900';
      feedbackEl.textContent = '❌ Incorrecto. ' + q.explanation;
    }

    nextBtn.classList.remove('hidden');
    nextBtn.focus();
  }

  function nextQuestion() {
    current++;
    if (current < questions.length) {
      renderQuestion();
    } else {
      showFinal();
    }
  }

  function showFinal() {
    quizArea.classList.add('hidden');
    finalScreen.classList.remove('hidden');
    finalScore.textContent = `${score} de ${questions.length}`;

    if (score === 3) {
      finalEmoji.textContent = '🏆';
      finalMessage.textContent = '¡Excelente! Dominás las fracciones equivalentes.';
      confetti({ particleCount: 120, spread: 70, origin: { y: 0.6 } });
    } else if (score === 2) {
      finalEmoji.textContent = '🌟';
      finalMessage.textContent = '¡Muy bien! Casi perfecto, seguí así.';
    } else if (score === 1) {
      finalEmoji.textContent = '👍';
      finalMessage.textContent = 'Bien, seguí practicando las fracciones equivalentes.';
    } else {
      finalEmoji.textContent = '💪';
      finalMessage.textContent = 'No te desanimes, ¡a repasar y volver a intentar!';
    }

    restartBtn.focus();
  }

  function restart() {
    current = 0;
    score = 0;
    finalScreen.classList.add('hidden');
    quizArea.classList.remove('hidden');
    renderQuestion();
  }

  nextBtn.addEventListener('click', nextQuestion);
  restartBtn.addEventListener('click', restart);

  renderQuestion();
</script>
</body>
</html>
