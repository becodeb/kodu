<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Estados del agua</title>
    <meta name="kodu-tema" content="laboratorio" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Tema "laboratorio" del kit de Kodu: blanco, naranja de seguridad y cobalto. */
      :root {
        --fondo: #f5f7f9;
        --superficie: #ffffff;
        --tinta: #111b2b;
        --suave: #536175;
        --linea: #d6dde6;
        --acento: #c2410c;
        --acento2: #1d5bd8;
        --exito: #13865a;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      html,
      body {
        height: 100%;
      }
      body {
        font-family: 'IBM Plex Sans', system-ui, sans-serif;
        background: var(--fondo);
        color: var(--tinta);
        display: flex;
        flex-direction: column;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }
      header {
        padding: 14px 20px 10px;
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
      }
      h1 {
        font-size: 20px;
        font-weight: 700;
        letter-spacing: -0.01em;
      }
      .pista {
        font-size: 13px;
        color: var(--suave);
      }
      main {
        flex: 1;
        display: grid;
        grid-template-columns: 1fr 250px;
        gap: 16px;
        padding: 0 20px 16px;
        min-height: 0;
      }
      .visor {
        position: relative;
        background: var(--superficie);
        border: 1px solid var(--linea);
        border-radius: 12px;
        overflow: hidden;
        cursor: grab;
        touch-action: none;
        min-height: 0;
      }
      .visor canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      .ayuda {
        position: absolute;
        left: 12px;
        bottom: 10px;
        font-size: 12px;
        color: var(--suave);
        display: flex;
        align-items: center;
        gap: 6px;
        pointer-events: none;
      }
      .panel {
        display: flex;
        flex-direction: column;
        gap: 12px;
        min-height: 0;
      }
      .panel > * {
        flex-shrink: 0;
      }
      .rot {
        font-size: 13px;
        font-weight: 600;
        color: var(--suave);
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .valor {
        font-size: 38px;
        font-weight: 700;
        letter-spacing: -0.02em;
        color: var(--acento);
        font-variant-numeric: tabular-nums;
        line-height: 1.1;
        margin: 2px 0 6px;
      }
      input[type='range'] {
        -webkit-appearance: none;
        appearance: none;
        width: 100%;
        height: 18px;
        background: transparent;
        margin: 0;
      }
      input[type='range']::-webkit-slider-runnable-track {
        height: 4px;
        border-radius: 2px;
        background: linear-gradient(to right, var(--acento) var(--p, 28%), var(--linea) var(--p, 28%));
      }
      input[type='range']::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: var(--acento);
        border: 3px solid var(--superficie);
        box-shadow: 0 0 0 1px var(--acento);
        margin-top: -7px;
      }
      input[type='range']::-moz-range-track {
        height: 4px;
        border-radius: 2px;
        background: var(--linea);
      }
      input[type='range']::-moz-range-progress {
        height: 4px;
        border-radius: 2px;
        background: var(--acento);
      }
      input[type='range']::-moz-range-thumb {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: var(--acento);
        border: 3px solid var(--superficie);
      }
      .escala {
        display: flex;
        justify-content: space-between;
        font-size: 11px;
        color: var(--suave);
        margin-top: 2px;
      }
      .estados {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        border: 1px solid var(--linea);
        border-radius: 8px;
        overflow: hidden;
        background: var(--superficie);
      }
      .estados span {
        font-size: 13px;
        font-weight: 600;
        text-align: center;
        padding: 8px 4px;
        color: var(--suave);
        transition: background 0.2s, color 0.2s;
      }
      .estados span + span {
        border-left: 1px solid var(--linea);
      }
      .estados span.on {
        background: var(--acento2);
        color: #fff;
      }
      .barra {
        height: 6px;
        border-radius: 3px;
        background: var(--linea);
        margin-top: 7px;
        overflow: hidden;
      }
      .barra i {
        display: block;
        height: 100%;
        width: 30%;
        background: var(--acento2);
        border-radius: 3px;
      }
      .mechero {
        font: inherit;
        font-size: 14px;
        font-weight: 600;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 11px;
        border: 0;
        border-radius: 8px;
        background: var(--acento);
        color: #fff;
        cursor: pointer;
      }
      .mechero[aria-pressed='true'] {
        background: var(--tinta);
      }
      .grafico {
        flex: 1;
        min-height: 110px;
        display: flex;
        flex-direction: column;
      }
      .grafico canvas {
        flex: 1;
        width: 100%;
        min-height: 0;
        margin-top: 6px;
        border-top: 1px solid var(--linea);
      }
      body.video .estados span {
        transition: none;
      }
      body.v1 .mechero,
      body.v1 .grafico {
        display: none;
      }
      @media (max-width: 720px) {
        html,
        body {
          height: auto;
        }
        body {
          overflow: auto;
        }
        main {
          grid-template-columns: 1fr;
          grid-template-rows: 280px auto;
        }
        header {
          flex-direction: column;
          gap: 2px;
        }
        .grafico {
          min-height: 120px;
        }
      }
    </style>
    <script type="importmap">
      { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" } }
    </script>
  </head>
  <body>
    <header>
      <h1>Estados del agua</h1>
      <span class="pista">Cambiá la temperatura y mirá cómo se mueven las partículas.</span>
    </header>

    <main>
      <div class="visor" id="visor">
        <canvas id="lienzo"></canvas>
        <span class="ayuda"
          ><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8" /><path d="M21 3v5h-5" /></svg
          >Arrastrá el frasco para girarlo</span
        >
      </div>

      <aside class="panel">
        <div>
          <div class="rot">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4v10.54a4 4 0 1 1-4 0V4a2 2 0 0 1 4 0Z" /></svg>
            Temperatura
          </div>
          <div class="valor" id="valor">20 °C</div>
          <input type="range" id="temp" min="-20" max="120" step="1" value="20" aria-label="Temperatura" />
          <div class="escala"><span>−20 °C</span><span>120 °C</span></div>
        </div>

        <div class="estados" id="estados">
          <span data-e="solido">Sólido</span><span data-e="liquido" class="on">Líquido</span><span data-e="gas">Gas</span>
        </div>

        <div>
          <div class="rot">Movimiento de las partículas</div>
          <div class="barra"><i id="barra"></i></div>
        </div>

        <button class="mechero" id="mechero" aria-pressed="false">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.07-2.14-.22-4.05 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.15.43-2.29 1-3a2.5 2.5 0 0 0 2.5 2.5z" /></svg>
          <span id="mecheroTxt">Encender mechero</span>
        </button>

        <div class="grafico">
          <div class="rot">Temperatura en el tiempo</div>
          <canvas id="grafico"></canvas>
        </div>
      </aside>
    </main>

    <script type="module">
      import * as THREE from 'three';

      // ─── Parámetros ─────────────────────────────────────────────
      const params = new URLSearchParams(location.search);
      const MODO_VIDEO = params.has('video');
      if (params.get('v') === '1') document.body.classList.add('v1');
      if (MODO_VIDEO) document.body.classList.add('video');
      const CON_MECHERO = !document.body.classList.contains('v1');
      // Ritmo del calentamiento: en clase va más lento para poder mirarlo.
      const RITMO = MODO_VIDEO ? 1 : 0.4;
      const C_CALOR = 80; // °C por unidad de calor
      const K_FUSION = 1 / 0.7; // fracción fundida por unidad de calor
      const K_EBULL = 1 / 0.8;

      const N = 64;
      const R_FRASCO = 1.05;
      const ALTO = 2.3;

      // Números al azar, pero siempre los mismos (así el frasco arranca igual cada vez).
      function azar(semilla) {
        return () => {
          semilla |= 0;
          semilla = (semilla + 0x6d2b79f5) | 0;
          let t = Math.imul(semilla ^ (semilla >>> 15), 1 | semilla);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }
      const rnd = azar(1482);

      // Un cuadrado se estira a un círculo sin cortes: así las moléculas rebotan
      // contra la pared redonda del frasco.
      const aDisco = (x, z) => [x * Math.sqrt(1 - (z * z) / 2), z * Math.sqrt(1 - (x * x) / 2)];
      const tri = (u, a, b) => {
        const L = b - a;
        const m = (((u - a) % (2 * L)) + 2 * L) % (2 * L);
        return a + (m < L ? m : 2 * L - m);
      };
      const suave = (x) => x * x * (3 - 2 * x);
      const lim = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));

      // ─── Moléculas ──────────────────────────────────────────────
      const mol = [];
      for (let i = 0; i < N; i++) {
        const ix = i % 4, iz = Math.floor(i / 4) % 4, iy = Math.floor(i / 16);
        const solido = new THREE.Vector3((ix - 1.5) * 0.34 + (iy % 2) * 0.08, 0.3 + iy * 0.3, (iz - 1.5) * 0.34 + (iy % 2) * 0.08);
        mol.push({
          solido,
          liq: [rnd() * 1.8 - 0.9, 0.16 + rnd() * 0.72, rnd() * 1.8 - 0.9],
          ond: [0.7 + rnd(), 0.6 + rnd(), 0.8 + rnd(), rnd() * 6.28, rnd() * 6.28, rnd() * 6.28],
          gas: [rnd() * 1.8 - 0.9, 0.2 + rnd() * 1.8, rnd() * 1.8 - 0.9],
          dir: new THREE.Vector3(rnd() - 0.5, rnd() - 0.5, rnd() - 0.5).normalize().multiplyScalar(0.8 + rnd() * 0.6),
          eje: new THREE.Vector3(rnd() - 0.5, rnd() - 0.5, rnd() - 0.5).normalize(),
          q0: new THREE.Quaternion().setFromEuler(new THREE.Euler(rnd() * 6.28, rnd() * 6.28, rnd() * 6.28)),
          vib: [rnd() * 6.28, rnd() * 6.28, rnd() * 6.28],
          giro: 0,
          m: 0,
          v: 0,
        });
      }
      // Se derriten y se evaporan primero las de arriba y las de afuera.
      const orden = mol
        .map((o, i) => ({ i, k: -o.solido.y * 2 - Math.hypot(o.solido.x, o.solido.z) + rnd() * 0.3 }))
        .sort((a, b) => a.k - b.k);
      orden.forEach((o, r) => (mol[o.i].rango = r));

      // ─── Estado de la simulación ────────────────────────────────
      const inicial = () => ({
        T: CON_MECHERO ? -20 : 20,
        Fm: CON_MECHERO ? 0 : 1,
        Fv: 0,
        mechero: false,
        llama: 0,
        reloj: 0,
        fase: 0,
        faseGas: 0,
        tCalor: 0,
        serie: [],
        az: 0.6,
        el: 0.2,
      });
      let S = inicial();
      function reiniciarMoleculas() {
        for (const o of mol) {
          o.m = S.Fm;
          o.v = S.Fv;
          o.giro = 0;
        }
      }
      reiniciarMoleculas();

      function energia() {
        return lim((S.T + 30) / 150, 0.06, 1);
      }

      function paso(dt) {
        S.reloj += dt;
        if (S.mechero) {
          let q = dt * RITMO;
          for (let k = 0; k < 4 && q > 1e-9; k++) {
            if (S.T < 0) {
              const d = Math.min(q * C_CALOR, -S.T);
              S.T += d;
              q -= d / C_CALOR;
            } else if (S.Fm < 1) {
              const d = Math.min(q * K_FUSION, 1 - S.Fm);
              S.Fm += d;
              q -= d / K_FUSION;
            } else if (S.T < 100) {
              const d = Math.min(q * C_CALOR, 100 - S.T);
              S.T += d;
              q -= d / C_CALOR;
            } else if (S.Fv < 1) {
              const d = Math.min(q * K_EBULL, 1 - S.Fv);
              S.Fv += d;
              q -= d / K_EBULL;
            } else {
              S.T = Math.min(120, S.T + q * C_CALOR);
              q = 0;
            }
          }
          S.tCalor += dt * RITMO;
          if (!S.serie.length || S.tCalor - S.serie[S.serie.length - 1][0] > 0.02) S.serie.push([S.tCalor, S.T]);
        } else {
          // Sin mechero manda el control: la temperatura cambia al instante y
          // las moléculas cambian de estado de a poco.
          const objM = S.T > 0 ? 1 : S.T < 0 ? 0 : S.Fm;
          const objV = S.T > 100 ? 1 : S.T < 100 ? 0 : S.Fv;
          S.Fm += lim(objM - S.Fm, -1.3 * dt, 1.3 * dt);
          S.Fv += lim(objV - S.Fv, -1.3 * dt, 1.3 * dt);
        }
        S.llama = lim(S.llama + (S.mechero ? 1 : -1) * dt * 4);
        const e = energia();
        S.fase += dt * (0.5 + 2.4 * e);
        S.faseGas += dt * (0.7 + 1.5 * e);
        for (const o of mol) {
          const objM = lim(S.Fm * N - o.rango * 0.999 - 0.0);
          const objV = lim(S.Fv * N - o.rango * 0.999);
          o.m += lim(lim(objM) - o.m, -dt * 2.4, dt * 2.4);
          o.v += lim(lim(objV) - o.v, -dt * 2.2, dt * 2.2);
          o.giro += dt * (o.m * 1.5 + o.v * 5) * (0.6 + e);
        }
      }

      // ─── Escena 3D ──────────────────────────────────────────────
      const lienzo = document.getElementById('lienzo');
      const visor = document.getElementById('visor');
      const renderer = new THREE.WebGLRenderer({ canvas: lienzo, antialias: true, preserveDrawingBuffer: MODO_VIDEO });
      renderer.setPixelRatio(MODO_VIDEO ? Number(params.get('dpr') || 2.5) : Math.min(2, window.devicePixelRatio || 1));
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      const escena = new THREE.Scene();
      escena.background = new THREE.Color('#f5f7f9');
      const camara = new THREE.PerspectiveCamera(32, 1, 0.1, 100);

      escena.add(new THREE.HemisphereLight(0xffffff, 0xc9d3e0, 1.35));
      const sol = new THREE.DirectionalLight(0xffffff, 1.9);
      sol.position.set(3, 7, 4);
      escena.add(sol);
      const relleno = new THREE.DirectionalLight(0xdfe8ff, 0.6);
      relleno.position.set(-4, 2, -3);
      escena.add(relleno);

      // Sombra suave dibujada sobre la mesada (sin mapas de sombra: más liviano).
      const Y_MESA = -1.6;
      {
        const c = document.createElement('canvas');
        c.width = c.height = 256;
        const g = c.getContext('2d');
        const gr = g.createRadialGradient(128, 128, 10, 128, 128, 128);
        gr.addColorStop(0, 'rgba(17,27,43,0.22)');
        gr.addColorStop(1, 'rgba(17,27,43,0)');
        g.fillStyle = gr;
        g.fillRect(0, 0, 256, 256);
        const sombra = new THREE.Mesh(
          new THREE.PlaneGeometry(4.2, 4.2),
          new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(c), transparent: true, depthWrite: false }),
        );
        sombra.rotation.x = -Math.PI / 2;
        sombra.position.y = Y_MESA + 0.002;
        escena.add(sombra);
      }

      // Frasco de vidrio con tapa, sobre un trípode.
      const metal = new THREE.MeshStandardMaterial({ color: '#8a96a8', metalness: 0.6, roughness: 0.35 });
      {
        const vidrio = new THREE.Mesh(
          new THREE.CylinderGeometry(R_FRASCO, R_FRASCO, ALTO, 72, 1, true),
          new THREE.MeshStandardMaterial({ color: '#dbe6f5', transparent: true, opacity: 0.2, roughness: 0.05, side: THREE.DoubleSide, depthWrite: false }),
        );
        vidrio.position.y = ALTO / 2;
        vidrio.renderOrder = 2;
        escena.add(vidrio);
        const borde = new THREE.MeshStandardMaterial({ color: '#9fb3cf', roughness: 0.3 });
        for (const y of [0.01, ALTO]) {
          const aro = new THREE.Mesh(new THREE.TorusGeometry(R_FRASCO, 0.028, 12, 96), borde);
          aro.rotation.x = Math.PI / 2;
          aro.position.y = y;
          escena.add(aro);
        }
        const fondo = new THREE.Mesh(
          new THREE.CircleGeometry(R_FRASCO, 72),
          new THREE.MeshStandardMaterial({ color: '#dbe6f5', transparent: true, opacity: 0.45, depthWrite: false }),
        );
        fondo.rotation.x = -Math.PI / 2;
        fondo.position.y = 0.012;
        escena.add(fondo);
        const tapa = new THREE.Mesh(new THREE.CylinderGeometry(R_FRASCO + 0.06, R_FRASCO + 0.06, 0.12, 72), new THREE.MeshStandardMaterial({ color: '#3a4a63', roughness: 0.55 }));
        tapa.position.y = ALTO + 0.06;
        escena.add(tapa);
        // Trípode
        const aro = new THREE.Mesh(new THREE.TorusGeometry(R_FRASCO * 0.95, 0.035, 10, 72), metal);
        aro.rotation.x = Math.PI / 2;
        aro.position.y = -0.03;
        escena.add(aro);
        for (let k = 0; k < 3; k++) {
          const a = (k / 3) * Math.PI * 2 + 0.5;
          const pata = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, -Y_MESA, 10), metal);
          pata.position.set(Math.cos(a) * R_FRASCO * 0.95, Y_MESA / 2, Math.sin(a) * R_FRASCO * 0.95);
          escena.add(pata);
        }
      }

      // Agua líquida y bloque de hielo (volúmenes tenues detrás de las moléculas).
      const agua = new THREE.Mesh(
        new THREE.CylinderGeometry(R_FRASCO - 0.03, R_FRASCO - 0.03, 1, 72),
        new THREE.MeshStandardMaterial({ color: '#1d5bd8', transparent: true, opacity: 0.1, depthWrite: false }),
      );
      escena.add(agua);
      const hielo = new THREE.Mesh(
        new THREE.BoxGeometry(1.35, 1.2, 1.35),
        new THREE.MeshStandardMaterial({ color: '#cfe0fb', transparent: true, opacity: 0.3, roughness: 0.15, depthWrite: false }),
      );
      hielo.position.y = 0.74;
      escena.add(hielo);

      // Mechero Bunsen
      const mechero = new THREE.Group();
      {
        const base = new THREE.Mesh(new THREE.CylinderGeometry(0.34, 0.4, 0.1, 40), new THREE.MeshStandardMaterial({ color: '#2b3547', roughness: 0.5 }));
        base.position.y = Y_MESA + 0.05;
        mechero.add(base);
        const tubo = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 0.9, 32), metal);
        tubo.position.y = Y_MESA + 0.55;
        mechero.add(tubo);
        const anillo = new THREE.Mesh(new THREE.CylinderGeometry(0.125, 0.125, 0.1, 32), new THREE.MeshStandardMaterial({ color: '#c2410c', roughness: 0.5 }));
        anillo.position.y = Y_MESA + 0.3;
        mechero.add(anillo);
      }
      escena.add(mechero);
      mechero.visible = CON_MECHERO;
      const Y_LLAMA = Y_MESA + 1.0;
      const llamaExt = new THREE.Mesh(
        new THREE.ConeGeometry(0.15, 0.46, 32, 1, true),
        new THREE.MeshBasicMaterial({ color: '#ff7a1a', transparent: true, opacity: 0.95, depthWrite: false, side: THREE.DoubleSide }),
      );
      const llamaInt = new THREE.Mesh(
        new THREE.ConeGeometry(0.08, 0.26, 24),
        new THREE.MeshBasicMaterial({ color: '#4f8dff', transparent: true, opacity: 0.95, depthWrite: false }),
      );
      llamaExt.geometry.translate(0, 0.23, 0);
      llamaInt.geometry.translate(0, 0.13, 0);
      llamaExt.position.y = llamaInt.position.y = Y_LLAMA;
      escena.add(llamaExt, llamaInt);
      const luzLlama = new THREE.PointLight(0xff8a3c, 0, 3, 1.5);
      luzLlama.position.set(0, Y_LLAMA + 0.4, 0);
      escena.add(luzLlama);

      // Moléculas: un oxígeno (cobalto) y dos hidrógenos (blancos), en instancias.
      const oxi = new THREE.InstancedMesh(new THREE.SphereGeometry(0.085, 24, 16), new THREE.MeshStandardMaterial({ color: '#1d5bd8', roughness: 0.3 }), N);
      const hid = new THREE.InstancedMesh(new THREE.SphereGeometry(0.052, 18, 12), new THREE.MeshStandardMaterial({ color: '#f4f6fa', roughness: 0.35 }), N * 2);
      escena.add(oxi, hid);
      const ANG = (104.5 * Math.PI) / 180;
      const OH = 0.1;
      const hA = new THREE.Vector3(Math.sin(ANG / 2) * OH, -Math.cos(ANG / 2) * OH, 0);
      const hB = new THREE.Vector3(-Math.sin(ANG / 2) * OH, -Math.cos(ANG / 2) * OH, 0);
      const _m = new THREE.Matrix4(), _q = new THREE.Quaternion(), _q2 = new THREE.Quaternion(), _p = new THREE.Vector3(), _h = new THREE.Vector3(), _one = new THREE.Vector3(1, 1, 1);
      const _L = new THREE.Vector3(), _G = new THREE.Vector3(), _Sd = new THREE.Vector3();

      function posMolecula(o, i, out) {
        const vibA = 0.01 + 0.035 * lim((S.T + 20) / 20);
        const t = S.reloj;
        _Sd.set(
          o.solido.x + vibA * Math.sin(29 * t + o.vib[0]),
          o.solido.y + vibA * Math.sin(31 * t + o.vib[1]),
          o.solido.z + vibA * Math.sin(37 * t + o.vib[2]),
        );
        const f = S.fase, w = o.ond;
        const lx = lim(o.liq[0] + 0.14 * Math.sin(w[0] * f + w[3]), -0.95, 0.95);
        const lz = lim(o.liq[2] + 0.14 * Math.sin(w[2] * f + w[5]), -0.95, 0.95);
        const [dx, dz] = aDisco(lx, lz);
        _L.set(dx * 0.93, o.liq[1] + 0.08 * Math.sin(w[1] * f + w[4]), dz * 0.93);
        const g = S.faseGas;
        const gx = tri(o.gas[0] + o.dir.x * g * 1.6, -0.95, 0.95);
        const gz = tri(o.gas[2] + o.dir.z * g * 1.6, -0.95, 0.95);
        const [ex, ez] = aDisco(gx, gz);
        _G.set(ex * 0.9, tri(o.gas[1] + o.dir.y * g * 1.6, 0.14, ALTO - 0.16), ez * 0.9);
        out.copy(_Sd).lerp(_L, suave(o.m)).lerp(_G, suave(o.v));
      }

      function actualizarEscena() {
        let liq = 0, sol = 0;
        mol.forEach((o, i) => {
          posMolecula(o, i, _p);
          _q2.setFromAxisAngle(o.eje, o.giro);
          _q.copy(o.q0).multiply(_q2);
          _m.compose(_p, _q, _one);
          oxi.setMatrixAt(i, _m);
          _h.copy(hA).applyQuaternion(_q).add(_p);
          _m.compose(_h, _q, _one);
          hid.setMatrixAt(i * 2, _m);
          _h.copy(hB).applyQuaternion(_q).add(_p);
          _m.compose(_h, _q, _one);
          hid.setMatrixAt(i * 2 + 1, _m);
          liq += o.m * (1 - o.v);
          sol += 1 - o.m;
        });
        oxi.instanceMatrix.needsUpdate = true;
        hid.instanceMatrix.needsUpdate = true;
        liq /= N;
        sol /= N;
        const h = 0.98 * Math.max(0.001, liq);
        agua.scale.y = h;
        agua.position.y = h / 2 + 0.015;
        agua.visible = liq > 0.01;
        hielo.material.opacity = 0.3 * sol;
        hielo.visible = sol > 0.01;
        const fl = S.llama * (1 + 0.07 * Math.sin(S.reloj * 31) + 0.05 * Math.sin(S.reloj * 17.3));
        llamaExt.scale.set(S.llama, Math.max(0.001, fl), S.llama);
        llamaInt.scale.set(S.llama, Math.max(0.001, S.llama * (1 + 0.04 * Math.sin(S.reloj * 23))), S.llama);
        llamaExt.visible = llamaInt.visible = S.llama > 0.01;
        luzLlama.intensity = 2.2 * S.llama;
        // cámara orbitando el frasco
        const r = 8.6;
        camara.position.set(Math.sin(S.az) * Math.cos(S.el) * r, 0.55 + Math.sin(S.el) * r, Math.cos(S.az) * Math.cos(S.el) * r);
        camara.lookAt(0, 0.45, 0);
      }

      function ajustarTam() {
        const w = visor.clientWidth, h = visor.clientHeight;
        if (!w || !h) return;
        renderer.setSize(w, h, false);
        camara.aspect = w / h;
        // En pantallas angostas (celular) se aleja para que entre el frasco completo.
        camara.fov = w / h < 1.05 ? 40 : 32;
        camara.updateProjectionMatrix();
      }

      // ─── Panel ──────────────────────────────────────────────────
      const $temp = document.getElementById('temp');
      const $valor = document.getElementById('valor');
      const $barra = document.getElementById('barra');
      const $mechero = document.getElementById('mechero');
      const $mecheroTxt = document.getElementById('mecheroTxt');
      const $graf = document.getElementById('grafico');
      const gctx = $graf.getContext('2d');

      function estadoActual() {
        if (S.Fv >= 0.5) return 'gas';
        if (S.Fm >= 0.5) return 'liquido';
        return 'solido';
      }

      function dibujarGrafico() {
        if (!CON_MECHERO) return;
        const dpr = MODO_VIDEO ? 2.5 : Math.min(2, window.devicePixelRatio || 1);
        const w = $graf.clientWidth, h = $graf.clientHeight;
        if (!w || !h) return;
        if ($graf.width !== Math.round(w * dpr)) {
          $graf.width = Math.round(w * dpr);
          $graf.height = Math.round(h * dpr);
        }
        const c = gctx;
        c.setTransform(dpr, 0, 0, dpr, 0, 0);
        c.clearRect(0, 0, w, h);
        const x0 = 4, x1 = w - 4, yT = 10, yB = h - 6;
        const y = (T) => yB - ((T + 30) / 160) * (yB - yT);
        c.font = '600 10.5px "IBM Plex Sans", system-ui, sans-serif';
        for (const [T, txt] of [[0, '0 °C · fusión'], [100, '100 °C · ebullición']]) {
          c.strokeStyle = '#d6dde6';
          c.setLineDash([3, 4]);
          c.beginPath();
          c.moveTo(x0, y(T));
          c.lineTo(x1, y(T));
          c.stroke();
          c.setLineDash([]);
          c.fillStyle = '#536175';
          c.fillText(txt, x1 - c.measureText(txt).width, y(T) - 4);
        }
        const serie = S.serie;
        if (serie.length < 2) return;
        const tMax = Math.max(3.4, serie[serie.length - 1][0]);
        const x = (t) => x0 + (t / tMax) * (x1 - x0);
        c.strokeStyle = '#c2410c';
        c.lineWidth = 2.5;
        c.lineJoin = 'round';
        c.beginPath();
        serie.forEach(([t, T], i) => (i ? c.lineTo(x(t), y(T)) : c.moveTo(x(t), y(T))));
        c.stroke();
        const [tu, Tu] = serie[serie.length - 1];
        c.fillStyle = '#c2410c';
        c.beginPath();
        c.arc(x(tu), y(Tu), 3.5, 0, Math.PI * 2);
        c.fill();
      }

      function actualizarPanel() {
        const T = Math.round(S.T);
        $valor.textContent = (T < 0 ? '−' : '') + Math.abs(T) + ' °C';
        if (document.activeElement !== $temp || MODO_VIDEO) $temp.value = T;
        $temp.style.setProperty('--p', ((T + 20) / 140) * 100 + '%');
        const e = estadoActual();
        for (const s of document.querySelectorAll('#estados span')) s.classList.toggle('on', s.dataset.e === e);
        $barra.style.width = energia() * 100 + '%';
        $mechero.setAttribute('aria-pressed', String(S.mechero));
        $mecheroTxt.textContent = S.mechero ? 'Apagar mechero' : 'Encender mechero';
        dibujarGrafico();
      }

      function dibujar() {
        ajustarTam();
        actualizarEscena();
        renderer.render(escena, camara);
        actualizarPanel();
      }

      // ─── Interacción ────────────────────────────────────────────
      $temp.addEventListener('input', () => {
        S.T = Number($temp.value);
        S.mechero = false;
      });
      $mechero.addEventListener('click', () => {
        S.mechero = !S.mechero;
        if (S.mechero && !S.serie.length) S.serie.push([0, S.T]);
      });
      let arrastre = null;
      visor.addEventListener('pointerdown', (ev) => {
        arrastre = { x: ev.clientX, y: ev.clientY, az: S.az, el: S.el };
        visor.setPointerCapture(ev.pointerId);
        visor.style.cursor = 'grabbing';
      });
      visor.addEventListener('pointermove', (ev) => {
        if (!arrastre) return;
        S.az = arrastre.az - (ev.clientX - arrastre.x) * 0.008;
        S.el = lim(arrastre.el + (ev.clientY - arrastre.y) * 0.005, 0.05, 1.2);
      });
      const soltar = () => {
        arrastre = null;
        visor.style.cursor = 'grab';
      };
      visor.addEventListener('pointerup', soltar);
      visor.addEventListener('pointercancel', soltar);

      if (!MODO_VIDEO) {
        let antes = performance.now();
        const bucle = (ahora) => {
          const dt = Math.min(0.05, (ahora - antes) / 1000);
          antes = ahora;
          if (!arrastre) S.az += dt * 0.3;
          paso(dt);
          dibujar();
          requestAnimationFrame(bucle);
        };
        requestAnimationFrame(bucle);
      } else {
        // Modo video: el tiempo lo maneja quien graba, cuadro por cuadro, con
        // pasos fijos para que dos grabaciones den exactamente lo mismo.
        let acciones = [];
        let t = 0;
        const aplicar = (a) => {
          if (a.tipo === 'temp') S.T = a.valor;
          if (a.tipo === 'mechero') {
            S.mechero = !S.mechero;
            if (S.mechero && !S.serie.length) S.serie.push([0, S.T]);
          }
        };
        const arrastres = () => acciones.filter((a) => a.tipo === 'arrastrarTemp' || a.tipo === 'girar');
        window.__video = {
          configurar(lista) {
            acciones = lista.slice().sort((a, b) => a.t - b.t);
            S = inicial();
            reiniciarMoleculas();
            t = 0;
          },
          cuadro(hasta) {
            if (hasta < t - 1e-6) this.configurar(acciones);
            while (t + 1 / 120 <= hasta) {
              const dt = 1 / 60;
              for (const a of acciones) if (a.t > t - 1e-9 && a.t <= t + dt - 1e-9) aplicar(a);
              for (const a of arrastres()) {
                if (t + dt < a.t || t > a.t1 + dt) continue;
                const x = lim((t + dt - a.t) / (a.t1 - a.t));
                const e = x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
                if (a.tipo === 'arrastrarTemp') S.T = Math.round(a.de + (a.a - a.de) * e);
                if (a.tipo === 'girar') S.azGiro = a.rad * e;
              }
              S.az += dt * 0.3;
              paso(dt);
              t += dt;
            }
            const az = S.az;
            S.az = az + (S.azGiro || 0);
            dibujar();
            S.az = az;
          },
        };
        window.__listo = true;
      }
      addEventListener('resize', () => MODO_VIDEO || dibujar());
    </script>
  </body>
</html>
