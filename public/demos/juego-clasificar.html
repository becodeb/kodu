<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Clasificá animales: vertebrados e invertebrados</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
</head>
<body class="h-screen w-full bg-gradient-to-b from-sky-50 to-slate-100 flex flex-col overflow-hidden text-slate-800">
<main class="flex-1 flex flex-col min-h-0 w-full max-w-3xl mx-auto p-2">
  <header class="flex items-center justify-between px-1">
    <h1 class="text-base sm:text-lg font-extrabold tracking-tight">🐾 ¿Vertebrado o invertebrado?</h1>
    <div class="flex items-center gap-2">
      <span class="text-xs font-bold uppercase text-slate-500">Puntos</span>
      <span id="score" class="text-lg font-extrabold bg-white border-2 border-slate-300 rounded-lg px-2">0</span>
    </div>
  </header>

  <div id="grid" class="grid grid-cols-4 gap-1.5 sm:gap-2 flex-1 content-center my-1"></div>

  <p id="feedback" aria-live="polite" class="min-h-[2.4rem] flex items-center justify-center text-center text-sm sm:text-base font-bold rounded-xl px-3 my-1 bg-slate-200/70 text-slate-700"></p>

  <div class="grid grid-cols-2 gap-2 pb-1">
    <button id="btn-vertebrado" type="button" class="rounded-2xl bg-emerald-600 hover:bg-emerald-700 active:scale-[0.98] text-white py-2.5 px-2 shadow-md focus:outline-none focus-visible:ring-4 focus-visible:ring-emerald-300 transition">
      <span class="block text-base sm:text-lg font-extrabold">🦴 Vertebrados</span>
      <span class="block text-[11px] sm:text-xs font-medium text-emerald-100">Tienen columna vertebral</span>
    </button>
    <button id="btn-invertebrado" type="button" class="rounded-2xl bg-orange-500 hover:bg-orange-600 active:scale-[0.98] text-white py-2.5 px-2 shadow-md focus:outline-none focus-visible:ring-4 focus-visible:ring-orange-300 transition">
      <span class="block text-base sm:text-lg font-extrabold">🦋 Invertebrados</span>
      <span class="block text-[11px] sm:text-xs font-medium text-orange-100">No tienen columna vertebral</span>
    </button>
  </div>
</main>

<div id="overlay" class="hidden fixed inset-0 z-50 bg-slate-900/70 items-center justify-center p-4">
  <div class="bg-white rounded-3xl shadow-2xl p-6 max-w-sm w-full text-center">
    <div class="text-6xl mb-2">🏆</div>
    <h2 class="text-2xl font-extrabold text-slate-800 mb-1">¡Felicitaciones!</h2>
    <p id="final-msg" class="text-slate-600 font-semibold mb-4"></p>
    <button id="btn-replay" type="button" class="w-full rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-extrabold py-3 text-lg focus:outline-none focus-visible:ring-4 focus-visible:ring-blue-300">🔁 Jugar de nuevo</button>
  </div>
</div>

<script>
const animals = [
  { id: 'perro', name: 'Perro', emoji: '🐶', group: 'vertebrado', why: 'tiene esqueleto interno y columna vertebral.' },
  { id: 'rana', name: 'Rana', emoji: '🐸', group: 'vertebrado', why: 'tiene columna vertebral.' },
  { id: 'aguila', name: 'Águila', emoji: '🦅', group: 'vertebrado', why: 'tiene columna vertebral.' },
  { id: 'pez', name: 'Pez', emoji: '🐟', group: 'vertebrado', why: 'tiene columna vertebral.' },
  { id: 'mariposa', name: 'Mariposa', emoji: '🦋', group: 'invertebrado', why: 'no tiene columna vertebral, es un insecto.' },
  { id: 'arana', name: 'Araña', emoji: '🕷️', group: 'invertebrado', why: 'no tiene columna vertebral, tiene exoesqueleto.' },
  { id: 'caracol', name: 'Caracol', emoji: '🐌', group: 'invertebrado', why: 'no tiene columna vertebral.' },
  { id: 'pulpo', name: 'Pulpo', emoji: '🐙', group: 'invertebrado', why: 'no tiene columna vertebral, es un molusco.' }
];

let selectedId = null;
let score = 0;
let done = new Set();
let missed = new Set();

const grid = document.getElementById('grid');
const feedback = document.getElementById('feedback');
const scoreEl = document.getElementById('score');
const overlay = document.getElementById('overlay');
const finalMsg = document.getElementById('final-msg');

function updateScore() {
  scoreEl.textContent = score;
}

function setFeedback(msg, kind) {
  feedback.textContent = msg;
  const styles = {
    info: 'bg-slate-200/70 text-slate-700',
    ok: 'bg-emerald-100 text-emerald-800',
    bad: 'bg-rose-100 text-rose-800'
  };
  feedback.className = 'min-h-[2.4rem] flex items-center justify-center text-center text-sm sm:text-base font-bold rounded-xl px-3 my-1 ' + (styles[kind] || styles.info);
}

function renderGrid() {
  grid.innerHTML = '';
  animals.forEach(a => {
    const isDone = done.has(a.id);
    const isSelected = selectedId === a.id;
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.disabled = isDone;
    btn.setAttribute('aria-label', isDone ? a.name + ' ya clasificado' : 'Elegir ' + a.name);

    let classes = 'animal-card rounded-xl border-2 flex flex-col items-center justify-center gap-0.5 py-1.5 px-1 transition shadow-sm focus:outline-none focus-visible:ring-4 focus-visible:ring-blue-300 ';
    if (isDone) {
      classes += 'bg-emerald-100 border-emerald-400 opacity-70 cursor-default';
    } else if (isSelected) {
      classes += 'bg-blue-100 border-blue-500 ring-4 ring-blue-300';
    } else {
      classes += 'bg-white border-slate-300 hover:border-blue-400 hover:bg-blue-50';
    }
    btn.className = classes;

    btn.innerHTML = isDone
      ? '<span class="text-2xl">✅</span><span class="text-xs font-bold text-emerald-700">' + a.name + '</span>'
      : '<span class="text-2xl">' + a.emoji + '</span><span class="text-xs font-bold text-slate-700">' + a.name + '</span>';

    btn.addEventListener('click', () => selectAnimal(a.id));
    grid.appendChild(btn);
  });
}

function selectAnimal(id) {
  if (done.has(id)) return;
  selectedId = (selectedId === id) ? null : id;
  renderGrid();
  setFeedback(selectedId ? '👉 Ahora tocá el grupo al que pertenece.' : 'Tocá un animal para empezar.', 'info');
}

function classify(group) {
  if (!selectedId) {
    setFeedback('👉 Primero tocá un animal para elegirlo.', 'info');
    return;
  }
  const a = animals.find(x => x.id === selectedId);
  const groupName = group === 'vertebrado' ? 'vertebrado' : 'invertebrado';

  if (a.group === group) {
    if (!missed.has(a.id)) score++;
    done.add(a.id);
    selectedId = null;
    updateScore();
    renderGrid();
    setFeedback('✅ ¡Muy bien! ' + a.name + ' es ' + groupName + ': ' + a.why, 'ok');
    if (done.size === animals.length) finish();
  } else {
    missed.add(a.id);
    selectedId = null;
    renderGrid();
    setFeedback('❌ ' + a.name + ' no es ' + groupName + ': ' + a.why + ' ¡Probá otra vez!', 'bad');
  }
}

function finish() {
  finalMsg.textContent = 'Acertaste ' + score + ' de ' + animals.length + ' a la primera.';
  overlay.classList.remove('hidden');
  overlay.classList.add('flex');

  if (typeof confetti === 'function') {
    const colors = ['#10b981', '#f97316', '#3b82f6', '#facc15'];
    const defaults = { spread: 60, ticks: 70, gravity: 0.9, decay: 0.94, startVelocity: 30, colors };
    confetti({ ...defaults, particleCount: 90, origin: { x: 0.5, y: 0.6 } });
    setTimeout(() => confetti({ ...defaults, particleCount: 50, angle: 60, origin: { x: 0, y: 0.7 } }), 200);
    setTimeout(() => confetti({ ...defaults, particleCount: 50, angle: 120, origin: { x: 1, y: 0.7 } }), 400);
  }
}

function reset() {
  selectedId = null;
  score = 0;
  done = new Set();
  missed = new Set();
  updateScore();
  renderGrid();
  setFeedback('Tocá un animal y mandalo a su grupo.', 'info');
  overlay.classList.add('hidden');
  overlay.classList.remove('flex');
}

document.getElementById('btn-vertebrado').addEventListener('click', () => classify('vertebrado'));
document.getElementById('btn-invertebrado').addEventListener('click', () => classify('invertebrado'));
document.getElementById('btn-replay').addEventListener('click', reset);

reset();
</script>
</body>
</html>
