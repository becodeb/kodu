<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITULO__</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<style>
/* ════════════════════════════════════════════════════════════════════
   COLECCIÓN MISIONES 3D · base común
   Cada juego cambia sólo --acento / --acento-2 / --cielo-* en :root.
   ════════════════════════════════════════════════════════════════════ */
:root{
  --acento:#f2b23a; --acento-2:#5fe0b5;
  --tinta:#0f1b2d; --tinta-2:#1c2b44; --tinta-3:#2a3c5c;
  --texto:#eef3fb; --texto-2:#b6c3d9; --texto-3:#7d8ca6;
  --ok:#3ddc97; --error:#ff5d6c; --aviso:#ffc43d;
  --papel:#fbf6ea; --papel-tinta:#2b2418; --papel-linea:#d9cfb8;
  --radio:14px;
  --f-titulo:'Bricolage Grotesque',system-ui,sans-serif;
  --f-texto:'Atkinson Hyperlegible',system-ui,sans-serif;
  --f-num:'JetBrains Mono',ui-monospace,monospace;
  --panel-w:380px; --barra-h:58px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--tinta);color:var(--texto);font-family:var(--f-texto);font-size:15px;line-height:1.45}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select{font:inherit}
.num{font-family:var(--f-num);font-weight:700}

/* ── Barra superior ─────────────────────────────────────────── */
#barra{position:fixed;inset:0 0 auto 0;height:var(--barra-h);display:flex;align-items:center;gap:14px;padding:0 16px;
  background:linear-gradient(180deg,rgba(15,27,45,.96),rgba(15,27,45,.86));border-bottom:1px solid rgba(255,255,255,.07);z-index:30;backdrop-filter:blur(8px)}
#barra .marca{display:flex;align-items:center;gap:10px;min-width:0}
#barra .marca .ico{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--acento);color:var(--tinta);font-family:var(--f-titulo);font-weight:800;font-size:18px;flex:none}
#barra h1{font-family:var(--f-titulo);font-weight:800;font-size:18px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#barra .sub{font-size:12px;color:var(--texto-3)}
#niveles{display:flex;gap:6px;margin-left:auto}
.chip-nivel{height:34px;min-width:34px;padding:0 10px;border-radius:10px;background:var(--tinta-2);border:1px solid var(--tinta-3);font-family:var(--f-num);font-weight:700;font-size:13px;display:flex;align-items:center;gap:6px;color:var(--texto-2)}
.chip-nivel[aria-current="true"]{background:var(--acento);border-color:var(--acento);color:var(--tinta)}
.chip-nivel.hecho:not([aria-current="true"]){border-color:var(--ok);color:var(--ok)}
.chip-nivel:disabled{opacity:.45;cursor:not-allowed}
.chip-nivel svg{width:13px;height:13px}
#modos{display:flex;background:var(--tinta-2);border:1px solid var(--tinta-3);border-radius:12px;padding:3px}
#modos button{padding:6px 12px;border-radius:9px;font-size:13px;font-weight:700;color:var(--texto-2);display:flex;gap:6px;align-items:center}
#modos button[aria-pressed="true"]{background:var(--texto);color:var(--tinta)}

/* ── Panel de misión ────────────────────────────────────────── */
#panel{position:fixed;top:calc(var(--barra-h) + 12px);left:12px;bottom:12px;width:var(--panel-w);z-index:20;display:flex;flex-direction:column;
  background:rgba(15,27,45,.92);border:1px solid rgba(255,255,255,.08);border-radius:18px;box-shadow:0 20px 50px rgba(0,0,0,.35);backdrop-filter:blur(10px);overflow:hidden}
#panel .cab{padding:16px 18px 12px;border-bottom:1px solid rgba(255,255,255,.06)}
#panel .etiqueta{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--acento);font-weight:700}
#panel h2{font-family:var(--f-titulo);font-weight:800;font-size:22px;line-height:1.15;margin-top:4px}
#panel .cuerpo{flex:1;overflow:auto;padding:14px 18px;display:flex;flex-direction:column;gap:14px}
#panel .cuerpo::-webkit-scrollbar{width:8px}#panel .cuerpo::-webkit-scrollbar-thumb{background:var(--tinta-3);border-radius:8px}
.relato{color:var(--texto-2);font-size:14.5px}
.relato b,.relato strong{color:var(--texto)}
.objetivo{background:rgba(255,255,255,.04);border-left:3px solid var(--acento);border-radius:0 10px 10px 0;padding:10px 12px;font-size:14px}
.objetivo .t{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--texto-3);font-weight:700;margin-bottom:3px}
.datos{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px;background:var(--tinta-2);border-radius:12px;padding:10px 12px}
.datos dt{color:var(--texto-3)} .datos dd{font-family:var(--f-num);font-weight:700}
.controles{display:flex;flex-direction:column;gap:10px}
.campo{display:flex;flex-direction:column;gap:5px}
.campo label{font-size:13px;color:var(--texto-2);font-weight:700}
.campo .fila{display:flex;gap:8px;align-items:center}
.entrada{width:100%;height:40px;border-radius:10px;border:1px solid var(--tinta-3);background:var(--tinta);color:var(--texto);padding:0 12px;font-family:var(--f-num);font-weight:700;font-size:15px}
.entrada:focus{outline:2px solid var(--acento);outline-offset:1px}
.entrada.mal{border-color:var(--error)} .entrada.bien{border-color:var(--ok)}
input[type=range]{width:100%;accent-color:var(--acento)}
.btn{height:42px;padding:0 16px;border-radius:12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .08s,filter .15s}
.btn:active{transform:translateY(1px)}
.btn-pri{background:var(--acento);color:var(--tinta)} .btn-pri:hover{filter:brightness(1.08)}
.btn-sec{background:var(--tinta-2);border:1px solid var(--tinta-3);color:var(--texto)} .btn-sec:hover{background:var(--tinta-3)}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.btn svg{width:17px;height:17px}
.btn-chico{height:32px;padding:0 10px;font-size:13px;border-radius:9px}
.grupo-btn{display:flex;flex-wrap:wrap;gap:6px}
.grupo-btn .btn[aria-pressed="true"]{background:var(--acento);color:var(--tinta);border-color:var(--acento)}
#panel .pie{padding:12px 18px 16px;border-top:1px solid rgba(255,255,255,.06);display:flex;flex-direction:column;gap:10px}
#panel .pie .acciones{display:flex;gap:8px}
#panel .pie .acciones .btn-pri{flex:1}
#mensaje{font-size:14px;border-radius:12px;padding:10px 12px;display:none}
#mensaje.ver{display:block}
#mensaje.ok{background:rgba(61,220,151,.12);border:1px solid rgba(61,220,151,.4);color:#c9f7e2}
#mensaje.error{background:rgba(255,93,108,.12);border:1px solid rgba(255,93,108,.4);color:#ffd5da}
#mensaje.info{background:rgba(255,196,61,.1);border:1px solid rgba(255,196,61,.35);color:#ffeec4}
#pistas{display:flex;flex-direction:column;gap:8px}
.pista{background:rgba(255,209,102,.08);border:1px dashed rgba(255,209,102,.45);border-radius:12px;padding:9px 12px;font-size:14px;color:#ffeec4}
.pista .n{font-size:11px;text-transform:uppercase;letter-spacing:.1em;font-weight:700;color:var(--acento-2);display:block;margin-bottom:2px}
.intentos{font-size:12px;color:var(--texto-3)}

/* ── Escena ─────────────────────────────────────────────────── */
#escena{position:fixed;inset:0;z-index:1}
#escena canvas{display:block}
#etiquetas{position:fixed;inset:0;pointer-events:none;z-index:2}
.lbl{font-family:var(--f-num);font-weight:700;font-size:13px;background:rgba(15,27,45,.85);color:#fff;padding:3px 7px;border-radius:7px;white-space:nowrap;border:1px solid rgba(255,255,255,.15)}
.lbl.acento{background:var(--acento);color:var(--tinta);border-color:transparent}
.lbl.claro{background:rgba(255,255,255,.92);color:var(--tinta)}
.lbl.grande{font-size:15px;padding:5px 9px}
.ayuda-camara{position:fixed;right:16px;bottom:14px;z-index:15;font-size:12px;color:var(--texto-2);background:rgba(15,27,45,.75);padding:6px 10px;border-radius:9px;pointer-events:none}

/* ── Vista matemática ───────────────────────────────────────── */
#vistaMat{position:fixed;top:calc(var(--barra-h) + 12px);right:12px;bottom:12px;width:min(46vw,620px);z-index:18;display:none;flex-direction:column;
  background:#fdfcf8;color:#1b2333;border-radius:18px;box-shadow:0 20px 50px rgba(0,0,0,.35);overflow:hidden}
body.modo-mat #vistaMat{display:flex}
body.modo-mat .ayuda-camara{display:none}
#vistaMat .cab{padding:12px 16px;border-bottom:1px solid #e6e1d4;display:flex;align-items:center;gap:10px}
#vistaMat .cab b{font-family:var(--f-titulo);font-size:16px}
#vistaMat .cab span{font-size:12px;color:#6b7280}
#vistaMat .lienzo{flex:1;min-height:0;padding:10px;display:flex;flex-direction:column;gap:8px;overflow:auto}
#vistaMat svg{width:100%;height:100%;min-height:260px;display:block}
#vistaMat .nota{font-size:13px;color:#4b5563;padding:0 4px}
#vistaMat .formula{font-family:var(--f-num);font-weight:700;font-size:15px;background:#f2efe6;border-radius:10px;padding:8px 12px;color:#1b2333}

/* ── Pantallas (portada, bitácora, final) ───────────────────── */
.capa{position:fixed;inset:0;z-index:50;display:none;place-items:center;padding:20px;background:rgba(8,14,26,.72);backdrop-filter:blur(6px)}
.capa.ver{display:grid}
.tarjeta{width:min(640px,100%);max-height:calc(100vh - 40px);overflow:auto;background:var(--tinta);border:1px solid rgba(255,255,255,.1);border-radius:22px;padding:28px;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.tarjeta h2{font-family:var(--f-titulo);font-weight:800;font-size:34px;line-height:1.05;letter-spacing:-.02em}
.tarjeta .kicker{font-size:12px;text-transform:uppercase;letter-spacing:.14em;color:var(--acento);font-weight:700;margin-bottom:8px}
.tarjeta p{color:var(--texto-2);margin-top:12px}
.tarjeta .misiones{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:18px}
.tarjeta .misiones div{background:var(--tinta-2);border-radius:12px;padding:10px 12px;font-size:13.5px}
.tarjeta .misiones b{display:block;font-family:var(--f-num);color:var(--acento);font-size:12px}
.tarjeta .acciones{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap}
.contenidos{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.contenidos span{font-size:12px;border:1px solid var(--tinta-3);border-radius:99px;padding:3px 10px;color:var(--texto-2)}

/* Bitácora: hoja de papel */
#bitacora .tarjeta{background:var(--papel);color:var(--papel-tinta);border:0;position:relative;
  background-image:repeating-linear-gradient(180deg,transparent 0 31px,rgba(217,207,184,.55) 31px 32px);background-position:0 112px}
#bitacora .tarjeta::before{content:"";position:absolute;left:52px;top:0;bottom:0;width:2px;background:rgba(220,90,90,.35)}
#bitacora .contenido{padding-left:44px}
#bitacora .kicker{color:#b4541a}
#bitacora h2{font-size:30px;color:var(--papel-tinta)}
#bitacora h3{font-family:var(--f-titulo);font-size:18px;margin-top:18px}
#bitacora ol{margin:10px 0 0 20px;display:flex;flex-direction:column;gap:9px;font-size:16px;line-height:1.4}
#bitacora .aclaracion{font-size:14px;color:#6b5b3e;margin-top:14px;font-style:italic}
#bitacora .confirmar{display:flex;gap:10px;align-items:flex-start;margin-top:18px;padding:12px 14px;background:#fff;border:2px solid #e3d8bf;border-radius:12px;cursor:pointer;font-weight:700}
#bitacora .confirmar input{width:22px;height:22px;accent-color:#b4541a;flex:none;margin-top:1px}
#bitacora .btn-pri{background:#b4541a;color:#fff}
#bitacora .resumen{font-size:13.5px;background:rgba(255,255,255,.7);border:1px solid #e3d8bf;border-radius:10px;padding:8px 12px;margin-top:12px;color:#4d4230}

/* Toast */
#toast{position:fixed;left:50%;top:calc(var(--barra-h) + 18px);transform:translateX(-50%) translateY(-20px);opacity:0;z-index:60;background:var(--ok);color:var(--tinta);font-weight:700;padding:10px 18px;border-radius:12px;transition:.3s;pointer-events:none}
#toast.ver{opacity:1;transform:translateX(-50%) translateY(0)}

.lbl.mini{font-size:10px;padding:0 4px;background:rgba(20,26,22,.55);border:0;border-radius:4px;color:#f4e7c2}
.lbl.jade{background:#5fe0b5;color:var(--tinta);border-color:transparent}
.tabla-mat{width:100%;border-collapse:collapse;font-size:12.5px;font-family:var(--f-num)}
.tabla-mat th,.tabla-mat td{border-bottom:1px solid #e6e1d4;padding:3px 6px;text-align:left}
.tabla-mat th{font-family:var(--f-texto);color:#6b7280;font-weight:700}
.secuencia{font-family:var(--f-num);font-weight:700;background:var(--tinta-2);border-radius:10px;padding:8px 12px;min-height:38px}
.vec{display:flex;align-items:center;gap:6px;font-family:var(--f-num);font-weight:700;font-size:18px}
.vec .entrada{width:84px;text-align:center}
#vistaMat .lienzo svg{height:auto;min-height:0;flex:none;max-height:54vh}
/* ── Responsive: panel abajo en pantallas chicas ─────────────── */
@media (max-width:860px){
  :root{--barra-h:96px}
  #barra{flex-wrap:wrap;height:auto;min-height:var(--barra-h);padding:8px 12px;row-gap:6px}
  #niveles{margin-left:0}
  #panel{top:auto;left:8px;right:8px;width:auto;height:46vh;bottom:8px}
  #vistaMat{left:8px;right:8px;width:auto;bottom:calc(46vh + 16px)}
  .ayuda-camara{display:none}
  .tarjeta{padding:20px}.tarjeta h2{font-size:26px}
  .tarjeta .misiones{grid-template-columns:1fr}
  #bitacora .contenido{padding-left:30px}#bitacora .tarjeta::before{left:34px}
}
</style>
</head>
<body>
<div id="escena"></div>
<div id="etiquetas"></div>

<header id="barra">
  <div class="marca"><div class="ico" id="marcaIco">?</div><div style="min-width:0"><h1 id="tituloJuego"></h1><div class="sub" id="subJuego"></div></div></div>
  <nav id="niveles" aria-label="Niveles"></nav>
  <div id="modos" role="group" aria-label="Modo de visualización">
    <button id="modoAventura" aria-pressed="true" title="Ver el escenario">Aventura</button>
    <button id="modoMat" aria-pressed="false" title="Ver la representación matemática">Matemático</button>
  </div>
</header>

<aside id="panel" aria-live="polite">
  <div class="cab"><div class="etiqueta" id="pnEtiqueta"></div><h2 id="pnTitulo"></h2></div>
  <div class="cuerpo">
    <div class="relato" id="pnRelato"></div>
    <div class="objetivo" id="pnObjetivo"><div class="t">Objetivo</div><div id="pnObjetivoTxt"></div></div>
    <div class="controles" id="pnControles"></div>
    <div id="pistas"></div>
  </div>
  <div class="pie">
    <div id="mensaje" role="status"></div>
    <div class="acciones">
      <button class="btn btn-sec" id="btnPista" title="Pedir una pista">Pista</button>
      <button class="btn btn-pri" id="btnComprobar">Comprobar</button>
    </div>
    <div class="intentos" id="intentos"></div>
  </div>
</aside>

<section id="vistaMat" aria-label="Representación matemática">
  <div class="cab"><b id="vmTitulo">Modo matemático</b><span id="vmSub"></span></div>
  <div class="lienzo" id="vmLienzo"></div>
</section>

<div class="ayuda-camara" id="ayudaCamara">Arrastrá el fondo para girar · rueda para acercar</div>
<div id="toast"></div>

<div class="capa" id="portada"><div class="tarjeta" id="portadaTarjeta"></div></div>

<div class="capa" id="bitacora" role="dialog" aria-modal="true" aria-labelledby="bitTitulo">
  <div class="tarjeta"><div class="contenido">
    <div class="kicker" id="bitKicker"></div>
    <h2 id="bitTitulo">Bitácora de misión</h2>
    <div class="resumen" id="bitResumen"></div>
    <h3>Antes de continuar, registrá en tu hoja:</h3>
    <ol id="bitPreguntas"></ol>
    <p class="aclaracion">Incluí tus cálculos, representaciones gráficas o esquemas cuando corresponda. Explicá con tus propias palabras.</p>
    <label class="confirmar"><input type="checkbox" id="bitCheck"> <span>Confirmo que registré mis respuestas en papel.</span></label>
    <div class="acciones" style="margin-top:16px;display:flex;gap:10px">
      <button class="btn btn-pri" id="bitContinuar" disabled>Continuar la misión</button>
    </div>
  </div></div>
</div>

<div class="capa" id="final"><div class="tarjeta" id="finalTarjeta"></div></div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

/* ════════════════════════════════════════════════════════════════════
   MOTOR COMÚN — no depende del juego. Cada juego define JUEGO más abajo.
   ════════════════════════════════════════════════════════════════════ */
const $ = (s, r = document) => r.querySelector(s);
const h = (tag, attrs = {}, ...hijos) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') el.className = v;
    else if (k === 'html') el.innerHTML = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) el.setAttribute(k, v === true ? '' : v);
  }
  for (const c of hijos.flat()) if (c != null) el.append(c instanceof Node ? c : document.createTextNode(c));
  return el;
};
const SVGNS = 'http://www.w3.org/2000/svg';
const s = (tag, attrs = {}, ...hijos) => {
  const el = document.createElementNS(SVGNS, tag);
  for (const [k, v] of Object.entries(attrs)) if (v != null) el.setAttribute(k, v);
  for (const c of hijos.flat()) if (c != null) el.append(c instanceof Node ? c : document.createTextNode(c));
  return el;
};

// Almacenamiento: el iframe de Kodu no tiene allow-same-origin, así que
// localStorage tira. Siempre detrás de try/catch, con memoria de respaldo.
const memoria = {};
const guardar = (k, v) => { memoria[k] = v; try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
const leer = (k, def) => { try { const v = localStorage.getItem(k); if (v != null) return JSON.parse(v); } catch {} return k in memoria ? memoria[k] : def; };

// ── Three.js: renderer, cámara, luces ──
const contenedor = $('#escena');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
contenedor.append(renderer.domElement);
const etiquetas = new CSS2DRenderer({ element: $('#etiquetas') });

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 2000);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.maxPolarAngle = Math.PI * 0.48;

const hemi = new THREE.HemisphereLight(0xdfefff, 0x6b5a45, 1.1);
scene.add(hemi);
const sol = new THREE.DirectionalLight(0xfff1dc, 2.2);
sol.position.set(30, 50, 20);
sol.castShadow = true;
sol.shadow.mapSize.set(2048, 2048);
Object.assign(sol.shadow.camera, { left: -60, right: 60, top: 60, bottom: -60, near: 1, far: 200 });
scene.add(sol);

// El panel izquierdo (y la vista matemática) tapan parte del canvas: corremos
// el centro óptico para que lo importante quede en la zona visible.
function ajustarTamano() {
  const w = innerWidth, hgt = innerHeight;
  renderer.setSize(w, hgt);
  etiquetas.setSize(w, hgt);
  camera.aspect = w / hgt;
  const angosto = w <= 860;
  const izq = angosto ? 0 : 392;
  const der = angosto ? 0 : (document.body.classList.contains('modo-mat') ? Math.min(w * 0.46, 620) + 12 : 0);
  const abajo = angosto ? hgt * 0.46 + 8 : 0;
  const libreW = w - izq - der, libreH = hgt - abajo;
  camera.clearViewOffset();
  if (izq || der || abajo) camera.setViewOffset(w, hgt, (der - izq) / 2, abajo / 2, w, hgt);
  camera.updateProjectionMatrix();
  return { libreW, libreH };
}
addEventListener('resize', ajustarTamano);

// ── Bucle ──
const tics = new Set();
const reloj = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(reloj.getDelta(), 0.05), t = reloj.elapsedTime;
  for (const f of tics) f(dt, t);
  controls.update();
  renderer.render(scene, camera);
  etiquetas.render(scene, camera);
});

// ── Grupo del nivel: todo lo que crea un nivel cuelga de acá y se limpia solo ──
let grupoNivel = new THREE.Group();
scene.add(grupoNivel);
let ticsNivel = [];
let limpiezasNivel = [];
function limpiarNivel() {
  for (const f of ticsNivel) tics.delete(f);
  ticsNivel = [];
  for (const f of limpiezasNivel) try { f(); } catch {}
  limpiezasNivel = [];
  grupoNivel.traverse(o => {
    if (o.isCSS2DObject) o.element.remove();
    if (o.geometry) o.geometry.dispose();
    if (o.material) [].concat(o.material).forEach(m => m.dispose());
  });
  scene.remove(grupoNivel);
  grupoNivel = new THREE.Group();
  scene.add(grupoNivel);
  arrastrables.length = 0;
  clicables.length = 0;
}

// ── Interacción: arrastrar sobre un plano, con imán a grilla ──
const raycaster = new THREE.Raycaster();
const puntero = new THREE.Vector2();
const arrastrables = []; // {obj, plano:THREE.Plane, snap, limites, alMover, alSoltar, filtro}
const clicables = [];    // {obj, alClic}
let arrastre = null;
function rayoDesde(ev) {
  const r = renderer.domElement.getBoundingClientRect();
  puntero.x = ((ev.clientX - r.left) / r.width) * 2 - 1;
  puntero.y = -((ev.clientY - r.top) / r.height) * 2 + 1;
  raycaster.setFromCamera(puntero, camera);
}
function buscarRaiz(obj, lista) {
  for (let o = obj; o; o = o.parent) { const e = lista.find(a => a.obj === o); if (e) return e; }
  return null;
}
renderer.domElement.addEventListener('pointerdown', ev => {
  rayoDesde(ev);
  const objs = [...arrastrables.map(a => a.obj), ...clicables.map(c => c.obj)];
  const hit = raycaster.intersectObjects(objs, true)[0];
  if (!hit) return;
  const a = buscarRaiz(hit.object, arrastrables);
  if (a && (!a.activo || a.activo())) {
    const p = new THREE.Vector3();
    raycaster.ray.intersectPlane(a.plano, p);
    arrastre = { a, desfase: a.obj.position.clone().sub(p) };
    controls.enabled = false;
    renderer.domElement.setPointerCapture(ev.pointerId);
    a.alTomar?.();
    return;
  }
  const c = buscarRaiz(hit.object, clicables);
  if (c) c.alClic(hit);
});
renderer.domElement.addEventListener('pointermove', ev => {
  rayoDesde(ev);
  if (!arrastre) {
    const objs = [...arrastrables.map(a => a.obj), ...clicables.map(c => c.obj)];
    renderer.domElement.style.cursor = raycaster.intersectObjects(objs, true).length ? 'grab' : '';
    return;
  }
  const { a, desfase } = arrastre;
  const p = new THREE.Vector3();
  if (!raycaster.ray.intersectPlane(a.plano, p)) return;
  p.add(desfase);
  if (a.snap) for (const eje of a.ejes) p[eje] = Math.round(p[eje] / a.snap) * a.snap;
  if (a.limites) for (const [eje, [min, max]] of Object.entries(a.limites)) p[eje] = Math.max(min, Math.min(max, p[eje]));
  for (const eje of ['x', 'y', 'z']) if (!a.ejes.includes(eje)) p[eje] = a.obj.position[eje];
  if (!p.equals(a.obj.position)) { a.obj.position.copy(p); a.alMover?.(p); }
});
const soltar = () => { if (arrastre) { arrastre.a.alSoltar?.(arrastre.a.obj.position); arrastre = null; controls.enabled = true; } };
renderer.domElement.addEventListener('pointerup', soltar);
renderer.domElement.addEventListener('pointercancel', soltar);

  /** Suelo amplio. */
  suelo(color = 0x7fb069, tam = 400) {

/* ════════════════════════════════════════════════════════════════════
   FLUJO: portada → nivel → comprobar → bitácora → siguiente nivel → final
   ════════════════════════════════════════════════════════════════════ */
let J;            // el juego
let nivel = 0;    // índice actual
let progreso;     // {resueltos:[bool], registrados:[bool]}
let pistasVistas = 0, intentos = 0, resuelto = false;
const docente = /docente/i.test(location.hash + location.search);

function claveProgreso() { return 'kodu-juego-' + J.id; }
function desbloqueado(i) { return docente || i === 0 || progreso.registrados[i - 1]; }

function pintarNiveles() {
  const nav = $('#niveles'); nav.innerHTML = '';
  J.niveles.forEach((n, i) => {
    const libre = desbloqueado(i);
    const b = h('button', { class: 'chip-nivel' + (progreso.registrados[i] ? ' hecho' : ''), 'aria-current': i === nivel ? 'true' : 'false', disabled: !libre, title: libre ? n.titulo : 'Se desbloquea al completar el nivel anterior' },
      libre ? '' : h('span', { html: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>' }),
      String(i + 1));
    b.addEventListener('click', () => libre && cargarNivel(i));
    nav.append(b);
  });
}

function cargarNivel(i) {
  nivel = i; pistasVistas = 0; intentos = 0; resuelto = false;
  limpiarNivel();
  const n = J.niveles[i];
  $('#pnEtiqueta').textContent = `Nivel ${i + 1} de ${J.niveles.length}`;
  $('#pnTitulo').textContent = n.titulo;
  $('#pnRelato').innerHTML = n.relato;
  $('#pnObjetivoTxt').innerHTML = n.objetivo;
  $('#pnControles').innerHTML = '';
  $('#pistas').innerHTML = '';
  $('#vmLienzo').innerHTML = '';
  $('#vmTitulo').textContent = n.tituloMat || 'Modo matemático';
  $('#vmSub').textContent = n.subMat || '';
  K.limpiarMensaje();
  actualizarPie();
  $('#btnComprobar').textContent = n.textoComprobar || 'Comprobar';
  n.armar(K);
  pintarNiveles();
  ajustarTamano();
  K.refrescarMat();
  if (!docente) guardar(claveProgreso() + '-ultimo', i);
}

function actualizarPie() {
  const n = J.niveles[nivel];
  const quedan = n.pistas.length - pistasVistas;
  $('#btnPista').disabled = quedan <= 0 || resuelto;
  $('#btnPista').textContent = quedan > 0 ? `Pista (${pistasVistas + 1}/${n.pistas.length})` : 'Sin más pistas';
  $('#intentos').textContent = intentos ? `Intentos: ${intentos} · Pistas usadas: ${pistasVistas}` : '';
  $('#btnComprobar').disabled = resuelto;
}

$('#btnPista').addEventListener('click', () => {
  const n = J.niveles[nivel];
  if (pistasVistas >= n.pistas.length) return;
  const txt = n.pistas[pistasVistas];
  pistasVistas++;
  $('#pistas').append(h('div', { class: 'pista' }, h('span', { class: 'n' }, `Pista ${pistasVistas}`), h('span', { html: typeof txt === 'function' ? txt(K) : txt })));
  $('#pistas').lastChild.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  actualizarPie();
});

$('#btnComprobar').addEventListener('click', () => {
  if (resuelto) return;
  const n = J.niveles[nivel];
  const r = n.comprobar(K);
  if (!r) return;               // el nivel puede manejar pasos intermedios
  if (r.parcial) { K.mensaje(r.msg, r.ok ? 'ok' : 'error'); return; } // paso intermedio de un nivel con fases
  intentos++;
  if (r.ok) {
    resuelto = true;
    K.mensaje(r.msg || '¡Misión cumplida!', 'ok');
    progreso.resueltos[nivel] = true; guardar(claveProgreso(), progreso);
    actualizarPie();
    const demora = n.alResolver ? n.alResolver(K) ?? 1600 : 900;
    const nivelResuelto = nivel;

/* ── Utilidades del templo ─────────────────────────────────────────── */
const TH = THREE;
const neg = n => (n < 0 ? '−' + Math.abs(n) : String(n));
const nd = n => { const r = Math.round(n * 100) / 100; return (r < 0 ? '−' : '') + String(Math.abs(r)).replace('.', ','); };
const fmtP = (x, y) => `(${neg(x)}, ${neg(y)})`;
const fmtPd = (x, y) => `(${nd(x)} ; ${nd(y)})`;
const igualP = (a, b) => a[0] === b[0] && a[1] === b[1];
let semilla = 11;
const rnd = () => (semilla = (semilla * 16807) % 2147483647) / 2147483647;
const PRIMA = '′';
/** Cámara: en pantallas angostas (celular) se aleja para que entre el tablero. */
function cam(pos, mira, op = {}) {
  const k = innerWidth <= 860 ? 1.75 : 1;
  K.camara(pos.map((v, i) => mira[i] + (v - mira[i]) * k), mira, { ...op, max: (op.max || 60) * k });

/** Tablero con coordenadas: mapea (x, y) matemáticos a la escena (en una pared o en el piso). */
function tablero({ xMin, xMax, yMin, yMax, ox = 0, oy = 0, oz = 0, pared = false, losa = 0x8f8573, linea = 0xf1e2b0, padre }) {
  const base = new TH.Matrix4();
  if (pared) base.makeTranslation(ox, oy, oz);
  else base.set(1, 0, 0, ox, 0, 0, 1, oy, 0, -1, 0, oz, 0, 0, 0, 1);
  const rot = new TH.Matrix4().extractRotation(base);
  const inv = base.clone().invert();
  const a3d = (x, y, h = 0) => new TH.Vector3(x, y, h).applyMatrix4(base);
  const am = v => { const p = v.clone().applyMatrix4(inv); return [Math.round(p.x), Math.round(p.y)]; };
  const g = new TH.Group(); (padre || K.grupo).add(g);
  const losaM = new TH.Mesh(new TH.BoxGeometry(xMax - xMin + 1.6, yMax - yMin + 1.6, 0.3), K.mat(losa));
  losaM.position.copy(a3d((xMin + xMax) / 2, (yMin + yMax) / 2, -0.16));
  losaM.quaternion.setFromRotationMatrix(base);
  losaM.receiveShadow = true; g.add(losaM);
  const pts = [];
  for (let x = xMin; x <= xMax; x++) pts.push(a3d(x, yMin, 0.01), a3d(x, yMax, 0.01));
  for (let y = yMin; y <= yMax; y++) pts.push(a3d(xMin, y, 0.01), a3d(xMax, y, 0.01));
  g.add(new TH.LineSegments(new TH.BufferGeometry().setFromPoints(pts), new TH.LineBasicMaterial({ color: linea, transparent: true, opacity: 0.6 })));
  if (xMin <= 0 && xMax >= 0) g.add(K.barra(a3d(0, yMin, 0.03).toArray(), a3d(0, yMax + 0.5, 0.03).toArray(), 0.045, 0x262a33));
  if (yMin <= 0 && yMax >= 0) g.add(K.barra(a3d(xMin, 0, 0.03).toArray(), a3d(xMax + 0.5, 0, 0.03).toArray(), 0.045, 0x262a33));
  for (let x = xMin; x <= xMax; x++) K.etiqueta(neg(x), a3d(x, yMin - 0.62, 0.05).toArray(), 'mini', g);
  for (let y = yMin; y <= yMax; y++) K.etiqueta(neg(y), a3d(xMin - 0.65, y, 0.05).toArray(), 'mini', g);
  K.etiqueta('x', a3d(xMax + 0.75, Math.max(yMin, Math.min(yMax, 0)), 0.05).toArray(), 'mini', g);
  K.etiqueta('y', a3d(Math.max(xMin, Math.min(xMax, 0)), yMax + 0.8, 0.05).toArray(), 'mini', g);
  const lim = pared ? { x: [xMin + ox, xMax + ox], y: [yMin + oy, yMax + oy] } : { x: [xMin + ox, xMax + ox], z: [oz - yMax, oz - yMin] };
  return { base, rot, inv, a3d, am, g, xMin, xMax, yMin, yMax, pared, lim, ejes: pared ? 'xy' : 'xz' };
}

/** Polígono (plano o extruido) en coordenadas del tablero. */
function malla(tab, pts, color, { h = 0.02, opac = 1, emis = 0, grosor = 0, local = false } = {}) {
  const sh = new TH.Shape(pts.map(([x, y]) => new TH.Vector2(x, y)));
  const geo = grosor ? new TH.ExtrudeGeometry(sh, { depth: grosor, bevelEnabled: false }) : new TH.ShapeGeometry(sh);
  if (grosor) geo.translate(0, 0, -grosor / 2);
  const m = new TH.Mesh(geo, K.mat(color, { transparent: opac < 1, opacity: opac, emissive: color, emissiveIntensity: emis, side: TH.DoubleSide, depthWrite: opac >= 1 }));
  m.matrixAutoUpdate = false;
  m.matrix.copy(local ? tab.rot : tab.base).multiply(new TH.Matrix4().makeTranslation(0, 0, h));
  m.castShadow = grosor > 0; m.receiveShadow = true;
  return m;
}
/** Bordes gruesos de un polígono. */
function bordes(tab, pts, color, r = 0.06, h = 0.05, cerrar = true) {
  const g = new TH.Group();
  const n = cerrar ? pts.length : pts.length - 1;
  for (let i = 0; i < n; i++) {
    const a = pts[i], b = pts[(i + 1) % pts.length];
    g.add(K.barra(tab.a3d(a[0], a[1], h).toArray(), tab.a3d(b[0], b[1], h).toArray(), r, color, { emissive: color, emissiveIntensity: 0.25 }));
  }
  return g;
}
/** Saca un grupo de la escena y borra sus etiquetas HTML. */
function quitar(g) {
  if (!g) return;
  g.traverse(o => { if (o.isCSS2DObject) o.element.remove(); if (o.geometry) o.geometry.dispose(); });
  g.parent?.remove(g);
}
/** Gema arrastrable que marca un vértice imagen. */
function gema(tab, nombre, x, y, color, { alMover, alSoltar, h = 0.4, padre, tam = 0.32 } = {}) {
  const g = new TH.Group();
  const m = new TH.Mesh(new TH.OctahedronGeometry(tam), K.mat(color, { emissive: color, emissiveIntensity: 0.35 }));
  m.castShadow = true; g.add(m);
  g.add(new TH.Mesh(new TH.SphereGeometry(0.55, 8, 6), new TH.MeshBasicMaterial({ transparent: true, opacity: 0, depthWrite: false })));
  const base = K.cilindro(0.2, 0.26, 0.08, 0x2b2418, [0, tab.pared ? 0 : -h + 0.05, tab.pared ? -h + 0.05 : 0], 10);
  if (tab.pared) base.rotation.x = Math.PI / 2;
  g.add(base);
  (padre || K.grupo).add(g);
  const lbl = K.etiqueta('', [0, 0.72, 0], 'acento', g);
  const gm = {
    obj: g, nombre, vivo: true,
    get p() { return tab.am(g.position); },
    poner(px, py, avisar = true) { g.position.copy(tab.a3d(px, py, h)); gm.rotular(); if (avisar) alMover?.(gm); },
    rotular() { const [a, b] = gm.p; lbl.texto(`${nombre} ${fmtP(a, b)}`); },
  };
  gm.poner(x, y, false);
  K.arrastrable(g, { ejes: tab.ejes, snap: 1, limites: tab.lim, activo: () => gm.vivo, alMover: () => { gm.rotular(); alMover?.(gm); }, alSoltar: () => alSoltar?.(gm) });
  K.tic((dt, t) => { m.rotation.y += dt * 1.2; m.position.y = tab.pared ? Math.sin(t * 2 + x) * 0.04 : 0.06 * Math.sin(t * 2 + x); });
  return gm;
}

/* ── Vista matemática: plano con unidades cuadradas ── */
function plano(xMin, xMax, yMin, yMax) {
  const ancho = 560, margen = 34, u = (ancho - 2 * margen) / (xMax - xMin);
  const alto = Math.round(u * (yMax - yMin) + 2 * margen);
  const p = K.planoCartesiano({ xMin, xMax, yMin, yMax, ancho, alto, margen });
  return p;
}
function mPoly(p, pts, { fill = 'none', stroke = '#1b2333', dash, op = 1, w = 2 } = {}) {
  p.g.append(K.s('polygon', { points: pts.map(([x, y]) => `${p.X(x)},${p.Y(y)}`).join(' '), fill, 'fill-opacity': op, stroke, 'stroke-width': w, 'stroke-dasharray': dash, 'stroke-linejoin': 'round' }));
}
function mSeg(p, a, b, { color = '#1b2333', dash, w = 1.5, flecha } = {}) {
  p.g.append(K.s('line', { x1: p.X(a[0]), y1: p.Y(a[1]), x2: p.X(b[0]), y2: p.Y(b[1]), stroke: color, 'stroke-width': w, 'stroke-dasharray': dash, 'marker-end': flecha ? 'url(#flecha)' : null }));
}
function mPunto(p, x, y, txt, color = '#1b2333', { dx = 6, dy = -6, r = 4, anchor = 'start' } = {}) {
  p.g.append(K.s('circle', { cx: p.X(x), cy: p.Y(y), r, fill: color, stroke: '#fff', 'stroke-width': 1.5 }));
  if (txt) p.g.append(K.s('text', { x: p.X(x) + dx, y: p.Y(y) + dy, fill: color, 'font-weight': 700, 'font-size': 11.5, 'text-anchor': anchor, stroke: '#fdfcf8', 'stroke-width': 3, 'paint-order': 'stroke' }, txt));
}
function formula(el, html) { el.append(K.h('div', { class: 'formula', html })); }
function nota(el, html) { el.append(K.h('div', { class: 'nota', html })); }
function tabla(el, cab, filas) {
  el.append(K.h('table', { class: 'tabla-mat', html: `<tr>${cab.map(c => `<th>${c}</th>`).join('')}</tr>` + filas.map(f => `<tr>${f.map(c => `<td>${c}</td>`).join('')}</tr>`).join('') }));
}
function animar(ms, f, fin) {
  let u = 0; const tf = K.tic(dt => { if (u >= 1) return; u = Math.min(1, u + dt * 1000 / ms); f(u); if (u >= 1) fin?.(); });
  return tf;
}

/* ── Decorado del templo (permanente) ── */
function escenaTemplo(K) {
  const S = K.scene;
  K.cielo(0x5aa7b8, 0xf6e3b4, [70, 230]);
  K.hemi.color.set(0xfff3d6); K.hemi.groundColor.set(0x4a5a34); K.hemi.intensity = 1.0;
  K.sol.color.set(0xffe2b0); K.sol.intensity = 2.4; K.sol.position.set(-26, 44, 24);
  const pasto = K.suelo(0x3f6b33); pasto.position.y = -0.3; S.add(pasto);
  // Plaza de piedra con escalones
  const cv = document.createElement('canvas'); cv.width = cv.height = 512; const cx = cv.getContext('2d');
  for (let i = 0; i < 8; i++) for (let j = 0; j < 8; j++) { cx.fillStyle = `hsl(${34 + rnd() * 8}, ${12 + rnd() * 10}%, ${50 + rnd() * 12}%)`; cx.fillRect(i * 64, j * 64, 64, 64); }
  cx.strokeStyle = 'rgba(52,44,30,.6)'; cx.lineWidth = 4;
  for (let i = 0; i <= 8; i++) { cx.beginPath(); cx.moveTo(i * 64, 0); cx.lineTo(i * 64, 512); cx.moveTo(0, i * 64); cx.lineTo(512, i * 64); cx.stroke(); }
  for (let i = 0; i < 70; i++) { cx.fillStyle = `rgba(${60 + rnd() * 30},${100 + rnd() * 40},55,${0.15 + rnd() * 0.3})`; cx.beginPath(); cx.arc(rnd() * 512, rnd() * 512, 3 + rnd() * 14, 0, 7); cx.fill(); }
  const texPiso = new TH.CanvasTexture(cv); texPiso.colorSpace = TH.SRGBColorSpace; texPiso.wrapS = texPiso.wrapT = TH.RepeatWrapping; texPiso.repeat.set(2.6, 2.3);
  for (let i = 0; i < 3; i++) S.add(K.caja(46 - i * 2.4, 0.4, 40 - i * 2.4, i === 2 ? 0xffffff : [0x857a66, 0x91866f][i], [0, -0.4 + i * 0.1, -2], i === 2 ? { map: texPiso } : undefined));
  // Losetas sueltas en la plaza
  for (let i = 0; i < 26; i++) {
    const x = (rnd() - 0.5) * 40, z = (rnd() - 0.5) * 34 - 2;
    if (Math.abs(x) < 13 && z > -12 && z < 12) continue;
    S.add(K.caja(1 + rnd() * 1.4, 0.06, 1 + rnd() * 1.2, rnd() < 0.5 ? 0xa59a82 : 0x7f755f, [x, 0.03, z]));
  }
  // Columnas con enredaderas (algunas rotas)
  const columna = (x, z, alto) => {
    const g = new TH.Group();
    g.add(K.caja(1.9, 0.5, 1.9, 0x8d8370, [0, 0.25, 0]));
    g.add(K.cilindro(0.62, 0.72, alto, 0xb1a58a, [0, 0.5 + alto / 2, 0], 10));
    if (alto > 6) g.add(K.caja(1.9, 0.5, 1.9, 0x8d8370, [0, alto + 0.75, 0]));
    for (let k = 0; k < 5; k++) {
      const hoja = new TH.Mesh(new TH.IcosahedronGeometry(0.32 + rnd() * 0.25, 0), K.mat(rnd() < 0.5 ? 0x2f7d45 : 0x4c9a4a));
      const a = rnd() * Math.PI * 2; hoja.position.set(Math.cos(a) * 0.68, 0.6 + rnd() * alto, Math.sin(a) * 0.68); g.add(hoja);
    }
    g.position.set(x, 0, z); S.add(g);
  };
  [-15, -7.5, 0, 7.5].forEach((z, i) => { columna(-21, z, i === 1 ? 3.2 : 7.5); columna(21, z, i === 2 ? 4.4 : 7.5); });
  // Pirámide escalonada al fondo con santuario
  for (let i = 0; i < 6; i++) S.add(K.caja(30 - i * 4.4, 2.4, 16 - i * 2.2, i % 2 ? 0x8a7f69 : 0x968a72, [0, 1.2 + i * 2.4, -34]));
  S.add(K.caja(5, 4, 4, 0x7a6f5a, [0, 16.4, -34]));
  S.add(K.caja(2, 2.6, 0.3, 0x1f1a14, [0, 15.7, -31.9]));
  S.add(K.caja(4.4, 3.5, 0.2, 0xe9c46a, [0, 10, -26.4]));
  // Selva alrededor
  for (let i = 0; i < 90; i++) {
    const a = rnd() * Math.PI * 2, r = 27 + rnd() * 40;
    const x = Math.cos(a) * r, z = Math.sin(a) * r - 4;
    if (z > 18 && Math.abs(x) < 25) continue;
    if (rnd() < 0.45) {
      const p = new TH.Group(), alto = 4 + rnd() * 4;
      const tronco = K.cilindro(0.18, 0.3, alto, 0x7a5a3a, [0, alto / 2, 0], 6); tronco.rotation.z = (rnd() - 0.5) * 0.25; p.add(tronco);
      for (let k = 0; k < 6; k++) {
        const hoja = new TH.Mesh(new TH.ConeGeometry(0.5, 3.2, 4), K.mat(k % 2 ? 0x2f8a4c : 0x3f9f55));
        hoja.position.y = alto; hoja.rotation.set(Math.PI / 2.6, k * Math.PI / 3, 0, 'YXZ'); hoja.translateY(1.4); hoja.castShadow = true; p.add(hoja);
      }
      p.position.set(x, -0.3, z); S.add(p);
    } else S.add(K.arbol([x, -0.3, z], 1.6 + rnd() * 1.8, [0x2d6e3e, 0x3d8a47, 0x245c34][Math.floor(rnd() * 3)]));
  }
  for (let i = 0; i < 18; i++) { const a = rnd() * Math.PI * 2, r = 24 + rnd() * 6; S.add(K.roca([Math.cos(a) * r, 0.2, Math.sin(a) * r - 3], 0.8 + rnd() * 1.3, 0x7d7a6c)); }
  // Haces de luz entre los árboles
  const matLuz = new TH.MeshBasicMaterial({ color: 0xfff1c4, transparent: true, opacity: 0.07, depthWrite: false, blending: TH.AdditiveBlending, side: TH.DoubleSide });
  [[-12, -14], [10, -18], [16, 6], [-17, 9]].forEach(([x, z]) => {
    const c = new TH.Mesh(new TH.CylinderGeometry(0.6, 3.2, 30, 12, 1, true), matLuz); c.position.set(x, 15, z); c.rotation.z = 0.35; S.add(c);
  });
  // Polvo dorado que flota
  const n = 140, pos = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) { pos[i * 3] = (rnd() - 0.5) * 50; pos[i * 3 + 1] = rnd() * 12; pos[i * 3 + 2] = (rnd() - 0.5) * 40; }
  const geo = new TH.BufferGeometry(); geo.setAttribute('position', new TH.BufferAttribute(pos, 3));
  const polvo = new TH.Points(geo, new TH.PointsMaterial({ color: 0xffe08a, size: 0.13, transparent: true, opacity: 0.8, depthWrite: false }));
  polvo.frustumCulled = false;
  const reloj0 = performance.now();
  polvo.onBeforeRender = () => { const t = (performance.now() - reloj0) / 1000; polvo.position.y = Math.sin(t * 0.4) * 0.6; polvo.rotation.y = t * 0.02; };
  S.add(polvo);
}

/* ════════ NIVEL 1 · Vitral por simetría axial ════════ */
const FASES_V = [

/* ════════ NIVEL 3 · Mosaico trasladado ════════ */
const L0 = [[0, 0], [4, 0], [4, 1], [1, 1], [1, 3], [0, 3]];

  { tipo: 'rot180', desc: 'girada 180°', rel: L0.map(([x, y]) => [4 - x, 3 - y]), ini: [-4, 9] },

const N3 = {
  titulo: 'El mosaico trasladado',
  tituloMat: 'Traslación', subMat: 'Vector, figura e imagen',
  relato: 'El piso del patio tiene un <b>mosaico</b> que se repite corrido siempre igual. El sello del sol muestra el corrimiento: pasó de <b>S(−4, 2)</b> a <b>S′(3, 5)</b>. En la bandeja hay cuatro piezas en forma de L que <b>parecen</b> iguales... pero sólo una sirve.',
  objetivo: 'Calculá el vector de traslación <b>v</b> a partir de S y S′, y llevá la pieza correcta al lugar donde v traslada la L original (vértice A en (−7, −5)). Ojo: la traslación no gira ni da vuelta las piezas.',
  armar(K) {
    cam([0, 17, 19], [0, 0, -1.5], { suave: false, min: 8, max: 45 });
    const tab = this.tab = tablero({ xMin: -8, xMax: 8, yMin: -6, yMax: 7, ox: 0, oy: 0.32, oz: 2, losa: 0x7b6a55, linea: 0xf3dfa8 });

    K.agregar(malla(tab, orig, 0xc8643b, { grosor: 0.3, h: 0.15, emis: 0.1 }));
    K.agregar(bordes(tab, orig, 0x3a2416, 0.05, 0.31));
    K.etiqueta(`A ${fmtP(...orig[0])}`, tab.a3d(orig[0][0] - 0.2, orig[0][1] - 0.1, 0.7).toArray(), 'claro');
    K.etiqueta('mosaico original', tab.a3d(-5.4, -3.6, 0.6).toArray(), 'mini');
    // Sellos del sol
    for (const [P, n] of [[S3, 'S'], [S3p, 'S' + PRIMA]]) {
      const sol = K.agregar(K.cilindro(0.42, 0.42, 0.14, 0xffc94a, tab.a3d(...P, 0.08).toArray(), 16, { emissive: 0xffb02e, emissiveIntensity: 0.6 }));
      for (let k = 0; k < 8; k++) { const r = K.caja(0.12, 0.1, 0.3, 0xffc94a, [Math.cos(k * Math.PI / 4) * 0.6, 0, Math.sin(k * Math.PI / 4) * 0.6]); r.rotation.y = -k * Math.PI / 4 + Math.PI / 2; sol.add(r); }

    }
    K.agregar(K.linea([tab.a3d(...S3, 0.2).toArray(), tab.a3d(...S3p, 0.2).toArray()], 0xffe08a, { discontinua: true }));

      K.etiqueta(`Pieza ${i + 1}`, new TH.Vector3(2, 1.5, 0.9).applyMatrix4(tab.rot).toArray(), '', g);

  verts(pz) { const [ax, ay] = pz.a; return pz.rel.map(([x, y]) => [x + ax, y + ay]); },

    if (enDestino.length) { const p = enDestino[0]; return { ok: false, msg: `La Pieza ${p.n} ocupa el lugar, pero está ${p.desc}. Una traslación no cambia la orientación: compará vértice a vértice, todos se tienen que mover lo mismo.` }; }

    if (igualP(ok.a, [ORIG3[0] + V3[1], ORIG3[1] + V3[0]])) return { ok: false, msg: 'Corriste la pieza con las componentes del vector intercambiadas.' };

  },
  alResolver(K) {
    const tab = this.tab;

    const g = K.agregar(new TH.Group()); g.add(fant); fant.matrixAutoUpdate = false;

  },
  mat(K, el) {
    const p = plano(-8, 8, -6, 7);
    mPoly(p, this.orig, { fill: '#c8643b', op: 0.35, stroke: '#7a3a1e' });
    this.orig.forEach(([x, y], i) => mPunto(p, x, y, i === 0 ? `A${fmtP(x, y)}` : NOMBRES3[i], '#7a3a1e', { r: 3, dx: i === 0 ? -4 : 5, dy: i === 0 ? 15 : -5 }));

  T: { f: (x, y) => [x + 3, y - 1], nombre: 'Traslación según v = (3, −1)', corto: 'Trasladar', formula: '(x, y) → (x + 3, y − 1)', color: 0xff7a59, css: '#d2492a' },

const aplicar4 = (ops, pts) => ops.reduce((ps, o) => ps.map(([x, y]) => OPS4[o].f(x, y)), pts);

/** Lee una expresión lineal en x e y ("3 − y", "x-1", "-x+4") → {x, y, c}; null si no se entiende. */
function leerLineal(txt) {
  const t = String(txt).toLowerCase().replace(/\s+/g, '').replace(/[−–]/g, '-');
  if (!t || !/^[-+0-9xy]+$/.test(t)) return null;
  const r = { x: 0, y: 0, c: 0 };
  for (const term of t.match(/[+-]?[^+-]+/g) || []) {
    const m = term.match(/^([+-]?)(\d+)?([xy])?$/);
    if (!m || (!m[2] && !m[3])) return null;
    const k = (m[1] === '-' ? -1 : 1) * (m[2] ? +m[2] : 1);
    r[m[3] || 'c'] += k;
  }
  return r;
}
const N4 = {

    K.etiqueta('C (0, 2)', [0, 0.85, 0], 'acento', c);
    const va = [-8, -3], vb = [-5, -4];
    K.agregar(K.barra(tab.a3d(...va, 0.1).toArray(), tab.a3d(vb[0] - 0.3, vb[1] + 0.1, 0.1).toArray(), 0.08, 0xff7a59));
    const punta = K.agregar(new TH.Mesh(new TH.ConeGeometry(0.22, 0.5, 10), K.mat(0xff7a59)));
    const dir = tab.a3d(...vb).sub(tab.a3d(...va)).normalize();
    punta.position.copy(tab.a3d(vb[0] - 0.2, vb[1] + 0.07, 0.1)); punta.quaternion.setFromUnitVectors(new TH.Vector3(0, 1, 0), dir);

    K.agregar(K.caja(8.2, 9, 0.4, 0x0d0b08, [0, 4.5, pz - 0.6]));
    this.hojas = [K.caja(4.1, 8.8, 0.6, 0x9a7a4a, [-2.05, 4.4, pz]), K.caja(4.1, 8.8, 0.6, 0x9a7a4a, [2.05, 4.4, pz])];

    this.luzPuerta = new TH.PointLight(0xffe2a0, 0, 30, 1.2); this.luzPuerta.position.set(0, 4, pz + 1); K.agregar(this.luzPuerta);
    // Llave de oro (geometría en el plano matemático; se mueve con matrices = movimientos rígidos)
    const sh = new TH.Shape(LLAVE.map(([x, y]) => new TH.Vector2(x, y)));
    sh.holes.push(new TH.Path([[-2.4, 3.8], [-1.6, 3.8], [-1.6, 5.2], [-2.4, 5.2]].map(([x, y]) => new TH.Vector2(x, y))));
    const geo = new TH.ExtrudeGeometry(sh, { depth: 0.3, bevelEnabled: false }); geo.translate(0, 0, -0.15);
    this.llave = K.agregar(new TH.Mesh(geo, K.mat(0xf2c04a, { metalness: 0.55, roughness: 0.35, emissive: 0x6b4a00, emissiveIntensity: 0.3 })));
    this.llave.castShadow = true; this.llave.matrixAutoUpdate = false;
    this.key0 = tab.base.clone().multiply(new TH.Matrix4().makeTranslation(0, 0, this.hK));
    K.agregar(malla(tab, LLAVE, 0xf2c04a, { h: 0.015, opac: 0.22 }));
    this.lblP = K.etiqueta('', [0, 0, 0], 'claro'); this.lblQ = K.etiqueta('', [0, 0, 0], 'claro');
    // Panel
    const caja = K.html(`<div class="campo"><label>Movimientos (cada uno, una vez)</label><div class="grupo-btn" id="ops4"></div></div>
      <div class="secuencia" id="sec4"></div>
      <div class="grupo-btn"><button class="btn btn-sec btn-chico" id="des4">Deshacer el último</button><button class="btn btn-sec btn-chico" id="rei4">Volver al inicio</button></div>
      <div class="campo"><label>Regla única que lleva la llave al encastre</label><div class="vec" style="font-size:15px">(x, y) → ( <input class="entrada" id="f4a" aria-label="primera coordenada" style="width:96px"> , <input class="entrada" id="f4b" aria-label="segunda coordenada" style="width:96px"> )</div></div>`);
    this.btns = {};
    ['R', 'H', 'T'].forEach(o => { const b = K.h('button', { class: 'btn btn-sec btn-chico', title: OPS4[o].nombre, html: `${OPS4[o].corto}` }); b.style.borderColor = OPS4[o].css; b.addEventListener('click', () => this.hacer(K, o)); caja.querySelector('#ops4').append(b); this.btns[o] = b; });
    caja.querySelector('#des4').addEventListener('click', () => this.deshacer(K));
    caja.querySelector('#rei4').addEventListener('click', () => { if (!this.animando) { this.ops = []; this.recalcular(K); } });
    this.sec = caja.querySelector('#sec4'); this.fa = caja.querySelector('#f4a'); this.fb = caja.querySelector('#f4b');
    [this.fa, this.fb].forEach(i => i.addEventListener('input', () => K.refrescarMat()));
    K.agregar(K.persona([-11, 0, 3], 0xf2b23a), K.persona([11, 0, 2], 0x5fe0b5), K.persona([10.4, 0, -3], 0xff7a59));
    this.ops = []; this.animando = false;
    this.recalcular(K);
  },
  completa(o) {
    const tab = this.tab, M = new TH.Matrix4();
    if (o === 'T') return M.makeTranslation(3, 0, 1);
    const p = tab.a3d(o === 'R' ? 1 : 0, 2, this.hK);
    const eje = o === 'R' ? new TH.Vector3(0, 0, -1) : new TH.Vector3(0, 1, 0);
    return new TH.Matrix4().makeTranslation(p.x, p.y, p.z).multiply(new TH.Matrix4().makeRotationAxis(eje, Math.PI)).multiply(new TH.Matrix4().makeTranslation(-p.x, -p.y, -p.z));
  },
  parcial(o, u, signo, inverso) {
    const tab = this.tab;
    if (o === 'T') { const k = inverso ? -u : u; return new TH.Matrix4().makeTranslation(3 * k, Math.sin(Math.PI * u) * 0.3, 1 * k); }
    const p = tab.a3d(o === 'R' ? 1 : 0, 2, this.hK);
    const eje = o === 'R' ? new TH.Vector3(0, 0, -1) : new TH.Vector3(0, 1, 0);
    const pts = aplicar4(this.ops, LLAVE);
    let lift = Math.sin(Math.PI * u) * 0.4;
    if (o === 'R') { const ds = pts.map(([x]) => (x - 1) * signo); lift = Math.sin(Math.PI * u) * (Math.max(0, ...ds) + 0.5); }
    return new TH.Matrix4().makeTranslation(p.x, p.y + lift, p.z).multiply(new TH.Matrix4().makeRotationAxis(eje, signo * Math.PI * u)).multiply(new TH.Matrix4().makeTranslation(-p.x, -p.y, -p.z));
  },
  matOps(ops) { return ops.reduce((M, o) => this.completa(o).multiply(M), new TH.Matrix4()); },
  recalcular(K) {
    this.llave.matrix.copy(this.matOps(this.ops)).multiply(this.key0);
    const pts = aplicar4(this.ops, LLAVE), tab = this.tab;
    const P = pts[IP], Q = pts[IQ];
    this.lblP.position.copy(tab.a3d(...P, 1.1)); this.lblP.texto(`P ${fmtP(...P)}`);
    this.lblQ.position.copy(tab.a3d(...Q, 1.1)); this.lblQ.texto(`Q ${fmtP(...Q)}`);
    for (const o of ['R', 'H', 'T']) {
      const usado = this.ops.includes(o);
      this.btns[o].disabled = usado || this.animando;
      this.sellos[o].material.emissiveIntensity = usado ? 1.2 : 0.05;
    }
    this.sec.innerHTML = this.ops.length ? 'Orden: ' + this.ops.map(o => `<span style="color:#${OPS4[o].color.toString(16)}">${OPS4[o].corto}</span>`).join(' → ') : '<span style="color:var(--texto-3)">Todavía no aplicaste movimientos.</span>';
    K.refrescarMat();
  },
  signoR() { const pts = aplicar4(this.ops, LLAVE); const m = pts.reduce((s, [x]) => s + x - 1, 0); return m < 0 ? 1 : -1; },
  hacer(K, o) {
    if (this.animando || this.ops.includes(o)) return;
    this.animando = true; this.recalcular(K);
    const Mprev = this.matOps(this.ops), signo = this.signoR();
    animar(1100, u => { const e = u < 0.5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2; this.llave.matrix.copy(this.parcial(o, e, signo, false)).multiply(Mprev).multiply(this.key0); },
      () => { this.ops.push(o); this.animando = false; this.recalcular(K); });
  },
  deshacer(K) {
    if (this.animando || !this.ops.length) return;
    const o = this.ops[this.ops.length - 1];
    this.animando = true; this.recalcular(K);
    const Mcur = this.matOps(this.ops);
    const quedan = this.ops.slice(0, -1), signo = this.signoR();
    animar(900, u => { const e = u < 0.5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2; this.llave.matrix.copy(this.parcial(o, e, signo, true)).multiply(Mcur).multiply(this.key0); },
      () => { this.ops = quedan; this.animando = false; this.recalcular(K); });
  },
  comprobar(K) {
    if (this.animando) return { parcial: true, ok: false, msg: 'Esperá a que termine el movimiento.' };
    if (this.ops.length < 3) return { ok: false, msg: 'La puerta tiene tres sellos y se encienden con los tres movimientos: aplicá la reflexión, el giro y la traslación (en el orden que elijas).' };
    const pts = aplicar4(this.ops, LLAVE);
    if (!pts.every((p, i) => igualP(p, DESTINO4[i]))) {
      return { ok: false, msg: `Con el orden ${this.ops.map(o => OPS4[o].corto).join(' → ')} la llave queda con la orientación del encastre, pero <b>corrida</b>: el orden de las transformaciones cambia dónde termina. Deshacé y probá otro orden, mirando dónde queda P.` };
    }
    const a = leerLineal(this.fa.value), b = leerLineal(this.fb.value);
    if (!a || !b) return { ok: false, msg: '¡La llave encaja! Falta la regla única: escribí cada coordenada con x, y y números (por ejemplo, algo como 2 − x o y + 4).' };
    const bienA = a.x === 1 && a.y === 0 && a.c === -1, bienB = b.x === 0 && b.y === -1 && b.c === 3;
    if (bienA && bienB) return { ok: true, msg: '¡La puerta se abre! Tres movimientos en el orden giro → traslación → reflexión equivalen a una sola regla: (x, y) → (x − 1, 3 − y).' };
    if (!bienB && b.y === 1) return { ok: false, msg: 'Revisá la segunda coordenada: la llave quedó dada vuelta (el diente apunta para el otro lado), así que cuando la y del punto original aumenta, la y de la imagen tiene que disminuir.' };
    if (!bienA && a.x === -1) return { ok: false, msg: 'Revisá la primera coordenada: la reflexión y el giro invierten la x cada uno, así que al final la x no queda invertida.' };
    if (a.y || b.x) return { ok: false, msg: 'En estos movimientos la x nueva depende sólo de x, y la y nueva sólo de y.' };
    return { ok: false, msg: 'Casi: probá tu regla con P y con Q en su posición inicial. Tiene que darte las coordenadas de P y Q en el encastre.' };
  },
  alResolver(K) {
    this.llave.material.emissiveIntensity = 1;
    animar(2200, u => { const e = 1 - Math.pow(1 - u, 3); this.hojas[0].position.x = -2.05 - e * 3.9; this.hojas[1].position.x = 2.05 + e * 3.9; this.luzPuerta.intensity = e * 40; });
    cam([0, 11, 12], [0, 3, -6]);
    return 2600;
  },
  mat(K, el) {
    const p = plano(-9, 9, -5, 7);
    mSeg(p, [1, -5], [1, 7], { color: '#1d9a6c', w: 2.5 });
    p.g.append(K.s('text', { x: p.X(1) + 5, y: p.Y(7) + 12, fill: '#1d9a6c', 'font-weight': 700 }, 'x = 1'));
    mSeg(p, [-8, -3], [-5, -4], { color: '#d2492a', w: 2.5, flecha: true });
    p.g.append(K.s('text', { x: p.X(-8), y: p.Y(-3) - 8, fill: '#d2492a', 'font-weight': 700 }, 'v = (3, −1)'));
    mPoly(p, DESTINO4, { fill: '#1b2333', op: 0.12, stroke: '#1b2333', dash: '6 3' });
    mPoly(p, LLAVE, { fill: 'none', stroke: '#9aa3b2', dash: '3 3', w: 1.5 });
    const pts = aplicar4(this.ops, LLAVE);
    mPoly(p, pts, { fill: '#f2b23a', op: 0.55, stroke: '#b4541a' });
    mPunto(p, 0, 2, 'C(0, 2)', '#b4541a', { r: 5 });
    mPunto(p, ...pts[IP], `P${fmtP(...pts[IP])}`, '#1b2333');
    mPunto(p, ...pts[IQ], `Q${fmtP(...pts[IQ])}`, '#1b2333', { anchor: 'end', dx: -6 });
    el.append(p.svg);
    formula(el, ['R', 'H', 'T'].map(o => `<span style="color:${OPS4[o].css}">${OPS4[o].nombre}: ${OPS4[o].formula}</span>`).join('<br>'));
    const filas = [['inicio', fmtP(...LLAVE[IP]), fmtP(...LLAVE[IQ])]];
    this.ops.forEach((o, i) => { const q = aplicar4(this.ops.slice(0, i + 1), LLAVE); filas.push([`${i + 1}. ${OPS4[o].corto}`, fmtP(...q[IP]), fmtP(...q[IQ])]); });
    tabla(el, ['Paso', 'P (diente)', 'Q (anillo)'], filas);
    const a = leerLineal(this.fa.value), b = leerLineal(this.fb.value);
    if (a && b) {
      const r = ([x, y]) => [a.x * x + a.y * y + a.c, b.x * x + b.y * y + b.c];
      nota(el, `Tu regla manda P${fmtP(...LLAVE[IP])} a ${fmtP(...r(LLAVE[IP]))} y Q${fmtP(...LLAVE[IQ])} a ${fmtP(...r(LLAVE[IQ]))}.`);
    } else nota(el, 'Seguí el recorrido de P y Q paso a paso y compará el principio con el final para encontrar la regla única.');
  },
  pistas: [
    'Cada movimiento tiene su regla. Componer es aplicar una regla al resultado de la anterior: por eso el orden puede cambiar el resultado. Probá un orden, mirá dónde queda P y compará con el encastre.',
    'Las seis maneras de ordenar los tres movimientos dejan la llave con la misma orientación, pero en lugares distintos. Anotá en tu hoja, para cada orden que pruebes, dónde queda P, y fijate cuál coincide con el diente del encastre.',
    'Para la regla única, compará P y Q al principio y al final: ¿cuánto cambió la x? ¿La y aumentó o disminuyó cuando la y original aumentaba? Una regla del tipo (x + m, n − y) se puede despejar con un solo punto.',
  ],
  bitacora: [
    '¿En qué orden aplicaste los movimientos? Escribí cómo cambian las coordenadas de P en cada paso usando las reglas.',
    'Mostrá con un ejemplo que el orden importa: ¿dónde queda P si aplicás primero la reflexión, después el giro y por último la traslación? ¿Por qué da distinto?',
    '¿Cómo obtuviste la regla única (x, y) → (x − 1, 3 − y)? Comprobala con el punto Q.',
  ],
  resumenBitacora() { return 'Abriste la puerta con el orden <b>giro de 180° → traslación → reflexión</b>, que equivale a la regla única (x, y) → (x − 1, 3 − y). P(3, 3) terminó en (2, 0).'; },
  prueba: {
    mal: [
      function (K) { this.ops = ['R', 'H', 'T']; this.recalcular(K); this.fa.value = 'x+1'; this.fb.value = '3-y'; },
      function (K) { this.ops = ['H', 'T', 'R']; this.recalcular(K); this.fa.value = 'x-1'; this.fb.value = 'y-3'; },
      function (K) { this.ops = ['H', 'T']; this.recalcular(K); this.fa.value = 'x-1'; this.fb.value = '3-y'; },
      function (K) { this.ops = ['T', 'H', 'R']; this.recalcular(K); this.fa.value = 'x-1'; this.fb.value = '3-y'; },
    ],
    bien(K) { this.ops = ['H', 'T', 'R']; this.recalcular(K); this.fa.value = 'x − 1'; this.fb.value = '3 − y'; },
  },
};

const JUEGO = {
  id: 'templo-movimientos',
  titulo: 'El templo de los movimientos',
  subtitulo: 'Colección Misiones 3D · Transformaciones en el plano',
  icono: 'T',
  kicker: 'Matemática · 3.er año · Misión 2',
  portada: 'En lo profundo de la selva, un templo de piedra guarda cuatro mecanismos que dejaron de funcionar. Los antiguos constructores los diseñaron con <b>movimientos</b>: reflejos, giros y corrimientos que no deforman nada. Tu equipo de restauración tiene que entender cada movimiento <b>punto por punto</b>, con coordenadas, para volver a ponerlos en marcha y abrir la puerta del santuario.',
  contenidos: ['Simetría axial', 'Simetría central', 'Traslación', 'Composición de transformaciones', 'Coordenadas en el plano'],
  final: { titulo: '¡El santuario está abierto!', texto: 'Restauraron los vitrales con <b>simetrías axiales</b>, hicieron girar el mecanismo con una <b>simetría central</b>, completaron el mosaico con una <b>traslación</b> y descubrieron que al <b>componer</b> movimientos el orden importa. Todos son movimientos rígidos: cambian la posición, pero conservan las distancias y los ángulos.' },
  escenaBase: escenaTemplo,
  niveles: [N1, N2, N3, N4],
};
iniciar(JUEGO);
