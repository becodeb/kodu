# ─────────────────────────────────────────────────────────────────────────────
# KoduEdu — despliegue en Coolify como UN SOLO recurso
#
# Reemplaza el par "aplicación Dockerfile + base administrada" por un único
# recurso de tipo Docker Compose. Coolify se encarga de:
#   · crear la red privada del recurso y conectarle el proxy;
#   · generar las etiquetas de Traefik a partir del `expose` del servicio `app`;
#   · inyectar `env_file: [.env]` en TODOS los servicios con las variables
#     cargadas en el panel del recurso.
#
# Por eso acá no hay secretos ni puertos publicados al host: las variables
# viven en Coolify y el único ingreso es el proxy.
#
#   Build pack:               Docker Compose
#   Compose file location:    /docker-compose.coolify.yml
#   Dominio (servicio `app`): https://kodu.becode.com.ar
#
# ── Sobre los volúmenes ──────────────────────────────────────────────────────
# Se usan volúmenes con nombre (`pgdata`, `uploads`). Con
# `compose_parsing_version: 5`, Coolify los prefija con el uuid del recurso e
# ignora `name:` y `external: true`, así que en el servidor quedan como:
#   · svs3pf21ca3h9mrx8h8lnkeg_pgdata   — base de datos de producción
#   · svs3pf21ca3h9mrx8h8lnkeg_uploads  — subidas de la app
#
# Los datos se migraron el 2026-09-25 desde los volúmenes de los recursos
# anteriores (postgres-data-wzz52stf5ofry13ajzdl24nm de `kodu-db` y
# svs3pf21ca3h9mrx8h8lnkeg-kodu-uploads), que antes se montaban por ruta
# absoluta. Esos bind mounts hacían que Docker viera los volúmenes como
# huérfanos y un `docker volume prune -a` borraba producción.
#
# NO renombrar `pgdata` ni `uploads` sin migrar los datos primero: un nombre
# nuevo es un volumen nuevo y vacío. Después de cualquier cambio acá,
# verificar en los logs de arranque que `prisma migrate deploy` diga
# "No pending migrations to apply".
# ─────────────────────────────────────────────────────────────────────────────

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: $POSTGRES_USER
      POSTGRES_PASSWORD: $POSTGRES_PASSWORD
      POSTGRES_DB: $POSTGRES_DB
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # $$ escapa la interpolación de compose: lo expande la shell del contenedor.
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      # Apunta al servicio `db` por su nombre dentro de la red del recurso.
      DATABASE_URL: $DATABASE_URL
    # `expose` no publica al host: solo le dice a Coolify a qué puerto enrutar.
    expose:
      - "3000"
    volumes:
      - uploads:/app/uploads
    healthcheck:
      # curl viene instalado en el stage `base` del Dockerfile.
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      # El entrypoint corre `prisma migrate deploy` antes de servir.
      start_period: 90s

volumes:
  pgdata:
  uploads:
