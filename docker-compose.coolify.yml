# ─────────────────────────────────────────────────────────────────────────────
# KoduEdu — despliegue en Coolify como UN SOLO recurso
#
# Reemplaza el par "aplicación Dockerfile + base administrada" por un único
# recurso de tipo Docker Compose. Coolify se encarga de:
#   · crear la red privada del recurso y conectarle el proxy;
#   · generar las etiquetas de Traefik a partir del `expose` del servicio `app`;
#   · inyectar `env_file: [.env]` en TODOS los servicios con las variables
#     cargadas en el panel del recurso.
#
# Por eso acá no hay secretos ni puertos publicados al host: las variables
# viven en Coolify y el único ingreso es el proxy.
#
#   Build pack:               Docker Compose
#   Compose file location:    /docker-compose.coolify.yml
#   Dominio (servicio `app`): https://kodu.becode.com.ar
#
# ── Sobre los montajes ───────────────────────────────────────────────────────
# Los dos montajes apuntan a rutas absolutas del host A PROPÓSITO, y no a
# volúmenes con nombre.
#
# Con `compose_parsing_version: 5`, Coolify reescribe toda referencia a un
# volumen con nombre prefijándola con el uuid del recurso, y esa reescritura
# ignora tanto `name:` como `external: true`. El resultado es un volumen nuevo
# y vacío. Las rutas absolutas, en cambio, el parser las deja intactas.
#
# Los dos directorios son los volúmenes que ya existen en el servidor y
# contienen los datos de producción de los recursos anteriores:
#   · postgres-data-wzz52stf5ofry13ajzdl24nm  — base administrada `kodu-db`
#   · svs3pf21ca3h9mrx8h8lnkeg-kodu-uploads   — subidas de la app `kodu`
#
# NO tocar estas rutas sin migrar los datos primero. Y ojo: un bind mount a una
# ruta inexistente NO falla, Docker crea un directorio vacío. Después de
# cualquier cambio acá, verificar en los logs de arranque que
# `prisma migrate deploy` diga "No pending migrations to apply".
# ─────────────────────────────────────────────────────────────────────────────

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: $POSTGRES_USER
      POSTGRES_PASSWORD: $POSTGRES_PASSWORD
      POSTGRES_DB: $POSTGRES_DB
    volumes:
      - /var/lib/docker/volumes/postgres-data-wzz52stf5ofry13ajzdl24nm/_data:/var/lib/postgresql/data
    healthcheck:
      # $$ escapa la interpolación de compose: lo expande la shell del contenedor.
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      # Apunta al servicio `db` por su nombre dentro de la red del recurso.
      DATABASE_URL: $DATABASE_URL
    # `expose` no publica al host: solo le dice a Coolify a qué puerto enrutar.
    expose:
      - "3000"
    volumes:
      - /var/lib/docker/volumes/svs3pf21ca3h9mrx8h8lnkeg-kodu-uploads/_data:/app/uploads
    healthcheck:
      # curl viene instalado en el stage `base` del Dockerfile.
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      # El entrypoint corre `prisma migrate deploy` antes de servir.
      start_period: 90s
